<!DOCTYPE html>
<html lang="en">

<title>Keeper Seven</title>
<!--
================================================================================
 KEEPER SEVEN — a serial thriller drawn and scored live in the browser.
 PART 1: "SIXTY SECONDS OF DARK"  (87 seconds, 22 shots)
================================================================================
 Everything on screen and everything you hear is generated in code at load.
 No assets, no samples, no keys, no accounts. Only dependency: three.js r128.

 THE SERIES
   A lighthouse at the edge of a dead ocean has been lit for nine hundred
   years. Its keeper has one rule and no memory of why. Each part ends on a
   question the next part has to answer.

 PART 1 — beat sheet (cuts every 3 s; the countdown is real time)
   0:00  RULE ONE: THE LIGHT NEVER GOES OUT.          0:03  It goes out.
   0:06  A 60-second relight window starts counting.  The keeper runs.
   0:12  Something vast circles the rock.             0:22  The keeper falls.
   0:27  Lightning: someone is standing at the lamp.
   0:36  "Keeper Seven."  "That is my name."  "It was mine first."
   0:45  It rises.  "Let it close. You have never seen what the light is for."
   1:05  The lever is pulled with 0.7 s left.         1:07  "It is beautiful."
   1:12  The beam's second pass puts the stars out.   "That was the last one."
   1:19  "Then what have we been keeping…"  "Fed."    The island opens its eye.
   1:22  Black.  TO BE CONTINUED.

 PART 2 — "WHAT THE LIGHT IS FOR" — is planned, not built. To add a part:
 write a new timeline (section 6), shot list (section 7) and score (section 9);
 the world, the rig, the camera rig, post and synth are shared.
================================================================================
-->
<style>
  :root {
    --ink: #e9e4d8;
    --ink-dim: rgba(233, 228, 216, 0.62);
    --gold: #ffd58a;
    --red: #ff6a55;
    --bar: rgba(8, 10, 14, 0.72);
    --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  /* 2.39:1 letterbox: the frame is the largest scope rectangle that fits. */
  #frame { position: relative; width: min(100vw, calc(100vh * 2.39)); width: min(100vw, calc(100dvh * 2.39)); aspect-ratio: 2.39 / 1; background: #000; overflow: hidden; container-type: inline-size; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; text-align: center; }

  #titleCard, #endCard { flex-direction: column; opacity: 0; will-change: opacity; }
  .film-title { font-weight: 400; font-size: clamp(13px, 3.1cqw, 46px); letter-spacing: 0.38em; margin: 0 -0.38em 0 0; white-space: nowrap; text-transform: uppercase; text-shadow: 0 0 2.2em rgba(255, 214, 150, 0.35); }
  .film-sub { font-family: var(--mono); font-size: clamp(8px, 1.05cqw, 14px); letter-spacing: 0.5em; margin: 1.6em -0.5em 0 0; color: var(--ink-dim); text-transform: uppercase; }
  #endCard .film-sub { margin-top: 1.2em; font-size: clamp(9px, 1.4cqw, 18px); color: var(--ink); }
  #titleCard .film-sub { font-size: clamp(9px, 1.5cqw, 20px); color: var(--ink); letter-spacing: 0.42em; margin-right: -0.42em; }

  #subtitle { align-items: flex-end; padding: 0 6% 5.2%; opacity: 0; will-change: opacity; }
  #subtitle span { font-family: var(--mono); font-size: clamp(9px, 1.55cqw, 21px); letter-spacing: 0.12em; line-height: 1.5; color: var(--ink); text-shadow: 0 1px 3px #000, 0 0 14px rgba(0, 0, 0, 0.9); white-space: pre-line; }
  #subtitle.who-sys span { color: var(--gold); }
  #subtitle.who-b span { color: var(--red); font-style: italic; }
  #hud { position: absolute; top: 6.5%; right: 4%; display: flex; flex-direction: column; align-items: flex-end; gap: 0.35em; font-family: var(--mono); color: var(--gold); opacity: 0; pointer-events: none; text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 1px 2px #000; }
  #hudLabel { font-size: clamp(7px, 0.95cqw, 13px); letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.8; }
  #hudTime { font-size: clamp(14px, 3cqw, 42px); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  #hud.danger { color: var(--red); }
  .film-sub.series { margin: 0 -0.5em 1.4em 0; color: var(--gold); }
  .parts { display: flex; gap: 1.6em; margin-top: 1.5em; font-family: var(--mono); font-size: clamp(8px, 0.95cqw, 12px); letter-spacing: 0.3em; text-transform: uppercase; color: rgba(233, 228, 216, 0.35); }
  .parts .now { color: var(--ink); border-bottom: 1px solid var(--gold); padding-bottom: 0.4em; }
  .follow { margin-top: 2em; font-family: var(--mono); font-size: clamp(11px, 2cqw, 26px); letter-spacing: 0.42em; margin-right: -0.42em; text-transform: uppercase; color: var(--red); animation: followPulse 1.6s ease-in-out infinite; }
  @keyframes followPulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .follow { animation: none; } }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .pill { pointer-events: auto; font-family: var(--mono); font-size: clamp(10px, 1.3cqw, 15px); letter-spacing: 0.4em; text-transform: uppercase; padding: 1em 1.4em 1em 1.8em; border: 1px solid rgba(233, 228, 216, 0.5); border-radius: 999px; background: rgba(0, 0, 0, 0.35); transition: background 0.25s, border-color 0.25s, color 0.25s; }
  .pill:hover, .pill:focus-visible { background: rgba(255, 213, 138, 0.14); border-color: var(--gold); color: var(--gold); outline: none; }

  #startCard { flex-direction: column; background: radial-gradient(ellipse at 50% 60%, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.82)); transition: opacity 0.9s; }
  #startCard.hidden { opacity: 0; visibility: hidden; transition: opacity 0.9s, visibility 0s 0.9s; }
  #startCard .pill { margin-top: 2.6em; }
  #startCard .note { font-family: var(--mono); font-size: clamp(8px, 0.95cqw, 12px); letter-spacing: 0.3em; color: var(--ink-dim); margin-top: 1.8em; text-transform: uppercase; min-height: 1.2em; }
  #endCard .pill { margin-top: 2.2em; }
  #endCard.live .pill { pointer-events: auto; }
  #endCard:not(.live) .pill { pointer-events: none; }

  #fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6%; background: linear-gradient(#05070c, #0b1420 62%, #03060a 62.4%, #000); }
  #fallback.show { display: flex; }
  #fallback p { font-family: var(--mono); font-size: clamp(10px, 1.4cqw, 15px); line-height: 1.8; letter-spacing: 0.06em; color: var(--ink-dim); max-width: 46em; margin: 1.6em 0 0; }

  /* Transport bar: lives in the bottom letterbox when there is one, otherwise floats over the frame. */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(transparent, var(--bar) 55%); font-family: var(--mono); font-size: 12px; color: var(--ink-dim); transition: opacity 0.35s; z-index: 5; }
  #controls.idle { opacity: 0; pointer-events: none; }
  #controls button { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  #controls button:hover, #controls button:focus-visible { background: rgba(255, 255, 255, 0.12); outline: none; }
  #controls svg { width: 18px; height: 18px; fill: currentColor; }
  #time { flex: none; min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  #scrub { flex: 1; min-width: 0; height: 40px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: none; }
  #scrub::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--gold) var(--pct, 0%), rgba(255, 255, 255, 0.25) var(--pct, 0%)); }
  #scrub::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); }
  #scrub::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--gold); }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); border: 0; }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 0; }
  #scrub:focus-visible { outline: 1px solid var(--gold); outline-offset: -8px; }
  @media (max-width: 520px) { #time { min-width: 70px; font-size: 11px; } #controls { gap: 4px; } #btnFs { display: none; } }
  @media (orientation: portrait) and (max-width: 600px) { #startNote:empty::after { content: "Rotate for a bigger picture"; } }
  @media (prefers-reduced-motion: reduce) { #startCard, #controls { transition: none; } }
</style>

<body>
<div id="stage">
  <div id="frame">

    <svg id="icoMuted" viewBox="0 0 24 24" style="display:none"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5zM21 9.6 19.6 8.2 17.5 10.3 15.4 8.2 14 9.6l2.1 2.1L14 13.8l1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
  </button>
  <button id="btnFs" type="button" aria-label="Toggle fullscreen">

  </button>
</div>

<script>
(function () {
'use strict';

/* ============================================================================
 * 1. CONFIG — every tunable number in the film has a name and lives here.
 * ========================================================================== */
const BPM = 120;
const BEAT = 60 / BPM;            // 0.5 s — the countdown ticks on every second beat
const TAU = Math.PI * 2;

const CFG = {
  DURATION: 87,
  ASPECT: 2.39,
  THREE_URLS: [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ],
  SEED: 0x1E57C0DE,

  RENDER: {
    MAX_PIXEL_RATIO: 2, MIN_SCALE: 0.5, SCALE_STEP: 0.85,
    SLOW_FRAME_MS: 24, FAST_FRAME_MS: 14, ADAPT_WINDOW: 45,
    MAX_PIXELS: 1920 * 804, NEAR: 0.2, FAR: 6000, MAX_FRAME_DT: 1
  },

  // --- story beats (seconds) -------------------------------------------------
  T: { LIGHT_OUT: 2.6, TIMER_ZERO: 66, STUMBLE: 22.5, IGNITE: 65.25, REVEAL: 66.6, REVEAL_DONE: 68.4, DOUSE: 72.6, DOUSE_DONE: 74.6, EYE_OPEN: 79.5, BLACK: 82.5, END_CARD: 83.3 },
  LIGHTNING: [                      // t, azimuth (rad), distance (m), strength
    { t: 1.5, az: 3.5, dist: 520, power: 0.5 },
    { t: 8.7, az: 3.9, dist: 300, power: 0.9 },
    { t: 13.5, az: 0.7, dist: 340, power: 0.8 },
    { t: 19.5, az: 5.2, dist: 380, power: 0.65 },
    { t: 22.5, az: 0.35, dist: 150, power: 1.3 },
    { t: 27.0, az: 3.3, dist: 330, power: 1.25 },
    { t: 40.5, az: 2.2, dist: 360, power: 0.6 },
    { t: 49.5, az: 0.25, dist: 420, power: 1.0 },
    { t: 58.5, az: 6.15, dist: 330, power: 1.1 }
  ],
  FLASH: { DECAY: 5.5, FLICKER_HZ: 55, RESTRIKE_DELAY: 0.21, RESTRIKE_GAIN: 0.7, WINDOW: 1.1, BOLT_VISIBLE: 0.34 },

  // --- world -------------------------------------------------------------------
  ROCK: { TOP_Y: 5, RX: 20, RY: 9, RZ: 17, CENTER_Y: -2.5, ROUGH: 1.7, FOAM_R: 19 },
  TOWER: { H: 30, R_BASE: 4.3, R_TOP: 3.0, SEGMENTS: 56 },
  STAIR: { STEPS: 100, RISE: 0.3, TURNS: 1.75, THETA0: -0.754, PATH_OFFSET: 0.85, SLAB_LEN: 1.5, SLAB_W: 0.64, SLAB_T: 0.13, RAIL_H: 1.02 },
  GALLERY: { DECK_R: 5.0, DECK_T: 0.35, RAIL_H: 1.05, POSTS: 28, LANTERN_R: 2.1, LANTERN_H: 4.2, LAMP_UP: 2.3, ROOF_H: 2.4 },
  BEAM: { PERIOD: 12, LENGTH: 520, RADIUS: 34, PHASE_T: 66.6, TILT: 0.035 },
  OCEAN: { RINGS: 110, SPOKES: 144, INNER: 2, OUTER: 4200, RING_POWER: 3.1 },
  WAVES: [                           // direction (deg), wavelength (m), amplitude (m), steepness
    { dir: 200, len: 67, amp: 1.25, steep: 0.55 },
    { dir: 232, len: 41, amp: 0.78, steep: 0.6 },
    { dir: 171, len: 23, amp: 0.42, steep: 0.62 },
    { dir: 251, len: 12.5, amp: 0.21, steep: 0.6 },
    { dir: 143, len: 6.8, amp: 0.1, steep: 0.55 }
  ],
  GRAVITY: 9.81,
  RAIN: { COUNT: 3200, BOX: 46, BOX_H: 34, SPEED: 30, SLANT_X: -9, SLANT_Z: 3, LENGTH: 0.95 },
  SPRAY: { COUNT: 620, PERIOD: 3.0 },
  WHALE: { LENGTH: 62, RADIUS: 6.6, STARS: 6800, DUST: 1500, NODES: 96, NODE_MIN_DIST: 6.5, LINK_MAX_DIST: 15, BEND_AMP: 5.2, BEND_FREQ: TAU / 6, BODY_SEG: 44, BODY_RAD: 18 },

  // --- character ---------------------------------------------------------------
  ROBOT: {
    THIGH: 0.43, SHIN: 0.43, UPPER_ARM: 0.37, FOREARM: 0.36, HIP_H: 0.8, HIP_W: 0.17, SHOULDER_W: 0.41, SHOULDER_H: 0.63,
    FOOT_H: 0.09, STRIDE: 0.48, STEP_LIFT: 0.15, BOB: 0.035, U_GROUND: 8, U_GALLERY: 200, GALLERY_STEPS: 5, HEAD_H: 1.83
  },

  POST: { BLOOM_THRESHOLD: 0.85, BLOOM_KNEE: 0.6, BLOOM_NEAR: 0.55, BLOOM_WIDE: 0.75, GRAIN: 0.055, VIGNETTE: 0.6, CHROMA: 0.0016, DOF_RANGE: 0.55 },

  AUDIO: { MASTER: 0.62, LOOKAHEAD: 0.6, AUTOMATION_STEP: 0.25, START_DELAY: 0.08, RESYNC_TOLERANCE: 0.12, REVERB_SECONDS: 3.6, NOISE_SECONDS: 4 },
  UI: { IDLE_HIDE_MS: 2600, SEEK_STEP: 3, POSTER_T: 14.6 }
};

/* ============================================================================
 * 2. UTIL — math, easing, deterministic randomness, keyframe tracks.
 * ========================================================================== */
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = (x) => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const fract = (x) => x - Math.floor(x);
/** 0 → 1 → 0 window with independent fade in/out. */
const pulse = (t, t0, tIn, tOut, t1) => smooth(t0, tIn, t) * (1 - smooth(tOut, t1, t));

const EASE = {
  linear: (t) => t,
  in: (t) => t * t * t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  soft: (t) => t * t * (3 - 2 * t),
  outBack: (t) => { const c = 1.70158; const u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; },
  step: (t) => (t < 1 ? 0 : 1)
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Scalar keyframe track: keys are [time, value, easeIntoThisKey]. Two keys at the same time make a cut. */
function sampleTrack(keys, t) {
  const n = keys.length;
  if (t <= keys[0][0]) return keys[0][1];
  if (t >= keys[n - 1][0]) return keys[n - 1][1];
  let i = 0;
  while (i < n - 2 && keys[i + 1][0] <= t) i++;
  const a = keys[i], b = keys[i + 1];
  const span = b[0] - a[0];
  if (span <= 0) return b[1];
  return a[1] + (b[1] - a[1]) * (b[2] || EASE.inOut)((t - a[0]) / span);
}

/** Uniform Catmull-Rom through [time, x, y, z] keys; writes into `out` (a THREE.Vector3). */
function sampleSpline(keys, t, out) {
  const n = keys.length;
  let i = 0;
  while (i < n - 2 && keys[i + 1][0] <= t) i++;
  const p1 = keys[i], p2 = keys[i + 1], p0 = keys[Math.max(i - 1, 0)], p3 = keys[Math.min(i + 2, n - 1)];
  const u = clamp((t - p1[0]) / (p2[0] - p1[0]), -0.2, 1.2), u2 = u * u, u3 = u2 * u;
  for (let c = 1; c <= 3; c++) {
    const v = 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * u + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * u2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * u3);
    if (c === 1) out.x = v; else if (c === 2) out.y = v; else out.z = v;
  }
  return out;
}

/** Deterministic smooth 1D noise in [-1, 1] for camera shake (no state, no allocation). */
function wobble(t, seed) {
  return (Math.sin(t * 1.7 + seed * 12.9) + Math.sin(t * 3.1 + seed * 4.3) * 0.6 + Math.sin(t * 7.3 + seed * 7.7) * 0.3) / 1.9;
}

/** Lightning brightness at film time t (0 = dark). Also reports which strike is live. */
const flashState = { value: 0, index: -1, age: 0 };
function evalFlash(t) {
  const F = CFG.FLASH;
  let total = 0, live = -1, liveAge = 0;
  for (let i = 0; i < CFG.LIGHTNING.length; i++) {
    const s = CFG.LIGHTNING[i], dt = t - s.t;
    if (dt < 0 || dt > F.WINDOW) continue;
    const flick = 0.62 + 0.38 * Math.sin(dt * F.FLICKER_HZ + i * 1.7);
    let v = Math.exp(-dt * F.DECAY) * flick;
    const d2 = dt - F.RESTRIKE_DELAY;
    if (d2 > 0) v += Math.exp(-d2 * F.DECAY * 1.4) * F.RESTRIKE_GAIN;
    total += v * s.power; live = i; liveAge = dt;
  }
  flashState.value = total; flashState.index = live; flashState.age = liveAge;
  return flashState;
}

/* ============================================================================
 * 3. ASSETS — procedural textures. Nothing is downloaded.
 * ========================================================================== */
function createAssets(THREE, disposables) {
  const rng = mulberry32(CFG.SEED);
  const NOISE_SIZE = 256;

  /** Tiling value-noise fBm on a NOISE_SIZE² grid, values in [0, 1]. */
  function tiledFbm(basePeriod, octaves, seed) {
    const out = new Float32Array(NOISE_SIZE * NOISE_SIZE);
    let amp = 0.5, period = basePeriod, norm = 0;
    for (let o = 0; o < octaves; o++) {
      const r = mulberry32(seed + o * 101);
      const lattice = new Float32Array(period * period);
      for (let i = 0; i < lattice.length; i++) lattice[i] = r();
      const cell = NOISE_SIZE / period;
      for (let y = 0; y < NOISE_SIZE; y++) {
        const fy = y / cell, y0 = Math.floor(fy), ty = fy - y0, sy = ty * ty * (3 - 2 * ty);
        const ya = (y0 % period) * period, yb = ((y0 + 1) % period) * period;
        for (let x = 0; x < NOISE_SIZE; x++) {
          const fx = x / cell, x0 = Math.floor(fx), tx = fx - x0, sx = tx * tx * (3 - 2 * tx);
          const xa = x0 % period, xb = (x0 + 1) % period;
          const top = lattice[ya + xa] + (lattice[ya + xb] - lattice[ya + xa]) * sx;
          const bot = lattice[yb + xa] + (lattice[yb + xb] - lattice[yb + xa]) * sx;
          out[y * NOISE_SIZE + x] += (top + (bot - top) * sy) * amp;
        }
      }
      norm += amp; amp *= 0.5; period *= 2;
    }
    for (let i = 0; i < out.length; i++) out[i] /= norm;
    return out;
  }

  const fbmA = tiledFbm(4, 5, 11), fbmB = tiledFbm(8, 4, 23), fbmC = tiledFbm(16, 3, 37), fbmD = tiledFbm(32, 2, 51);
  const sampleFbm = (f, x, y) => f[((y % NOISE_SIZE + NOISE_SIZE) % NOISE_SIZE | 0) * NOISE_SIZE + ((x % NOISE_SIZE + NOISE_SIZE) % NOISE_SIZE | 0)];

  function dataTexture(fill) {
    const data = new Uint8Array(NOISE_SIZE * NOISE_SIZE * 4);
    for (let y = 0; y < NOISE_SIZE; y++) for (let x = 0; x < NOISE_SIZE; x++) fill(data, (y * NOISE_SIZE + x) * 4, x, y);
    const tex = new THREE.DataTexture(data, NOISE_SIZE, NOISE_SIZE, THREE.RGBAFormat);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.generateMipmaps = true; tex.needsUpdate = true;
    disposables.push(tex);
    return tex;
  }

  // RGBA = four independent fBm fields: clouds, water foam, beam dust, nebula.
  const noise = dataTexture((d, i, x, y) => {
    d[i] = fbmA[y * NOISE_SIZE + x] * 255; d[i + 1] = fbmB[y * NOISE_SIZE + x] * 255;
    d[i + 2] = fbmC[y * NOISE_SIZE + x] * 255; d[i + 3] = fbmD[y * NOISE_SIZE + x] * 255;
  });

  // Tangent-space ripple normals derived from a height field (central differences).
  const RIPPLE_HEIGHT = 5.0;
  const waterNormal = dataTexture((d, i, x, y) => {
    const h = (px, py) => sampleFbm(fbmB, px, py) * 0.6 + sampleFbm(fbmC, px, py) * 0.3 + sampleFbm(fbmD, px, py) * 0.1;
    const dx = (h(x + 1, y) - h(x - 1, y)) * RIPPLE_HEIGHT, dy = (h(x, y + 1) - h(x, y - 1)) * RIPPLE_HEIGHT;
    const inv = 1 / Math.hypot(dx, dy, 1);
    d[i] = (-dx * inv * 0.5 + 0.5) * 255; d[i + 1] = (-dy * inv * 0.5 + 0.5) * 255; d[i + 2] = (inv * 0.5 + 0.5) * 255; d[i + 3] = 255;
  });

  function canvasTexture(size, draw, srgb) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d', { willReadFrequently: true }), size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    if (srgb) tex.encoding = THREE.sRGBEncoding;
    disposables.push(tex);
    return tex;
  }
  const grey = (v, a) => 'rgba(' + (v | 0) + ',' + (v | 0) + ',' + (v | 0) + ',' + (a === undefined ? 1 : a) + ')';

  /** Per-pixel fBm grain over whatever is already painted. */
  function speckle(ctx, size, field, strength, scale) {
    const img = ctx.getImageData(0, 0, size, size), d = img.data;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const n = (sampleFbm(field, x * scale, y * scale) - 0.5) * strength * 255, i = (y * size + x) * 4;
      d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
    }
    ctx.putImageData(img, 0, 0);
  }

  // --- coursed stone: colour and height maps drawn from the same block layout ----
  const STONE = { SIZE: 1024, ROWS: 20, BLOCKS: 9, MORTAR: 5 };
  function stoneLayout() {
    const r = mulberry32(CFG.SEED ^ 0x51);
    const rows = [];
    for (let j = 0; j < STONE.ROWS; j++) {
      const blocks = [], offset = r();
      for (let k = 0; k < STONE.BLOCKS; k++) blocks.push({ x: (k + offset + (r() - 0.5) * 0.22) / STONE.BLOCKS, tone: r(), chip: r() });
      rows.push(blocks);
    }
    return rows;
  }
  const layout = stoneLayout();
  function drawStone(ctx, size, mode) {
    const rowH = size / STONE.ROWS;
    ctx.fillStyle = mode === 'height' ? grey(40) : '#1b1d20';
    ctx.fillRect(0, 0, size, size);
    for (let j = 0; j < STONE.ROWS; j++) {
      const blocks = layout[j];
      for (let k = 0; k < blocks.length; k++) {
        const b = blocks[k], next = blocks[(k + 1) % blocks.length];
        const x0 = b.x * size, x1 = (k + 1 < blocks.length ? next.x : next.x + 1) * size;
        // faded oxide-red day-mark bands, as on real towers
        const banded = (j >= 4 && j <= 6) || (j >= 12 && j <= 14);
        for (let wrap = -1; wrap <= 1; wrap++) {
          const px = x0 + wrap * size + STONE.MORTAR / 2, w = x1 - x0 - STONE.MORTAR;
          if (mode === 'height') ctx.fillStyle = grey(150 + b.tone * 80);
          else {
            const v = 128 + b.tone * 52;
            ctx.fillStyle = banded ? 'rgb(' + (v * 0.93 | 0) + ',' + (v * 0.5 | 0) + ',' + (v * 0.42 | 0) + ')' : 'rgb(' + (v * 0.98 | 0) + ',' + (v * 0.99 | 0) + ',' + (v | 0) + ')';
          }
          ctx.fillRect(px, j * rowH + STONE.MORTAR / 2, w, rowH - STONE.MORTAR);
          if (b.chip > 0.72) {          // chipped corner
            ctx.fillStyle = mode === 'height' ? grey(70) : 'rgba(20,22,26,0.75)';
            ctx.beginPath(); ctx.moveTo(px, j * rowH + 2); ctx.lineTo(px + rowH * 0.35 * b.chip, j * rowH + 2); ctx.lineTo(px, j * rowH + rowH * 0.4 * b.chip); ctx.fill();
          }
        }
      }
    }
    if (mode === 'height') { speckle(ctx, size, fbmD, 0.22, 1.7); return; }
    // rain streaks and grime running down the wall
    const r = mulberry32(CFG.SEED ^ 0x77);
    for (let s = 0; s < 90; s++) {
      const x = r() * size, y = r() * size, len = (0.12 + r() * 0.5) * size, w = 3 + r() * 16;
      const g = ctx.createLinearGradient(0, y, 0, y + len);
      g.addColorStop(0, 'rgba(8,10,12,' + (0.12 + r() * 0.3) + ')'); g.addColorStop(1, 'rgba(8,10,12,0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, len);
    }
    speckle(ctx, size, fbmC, 0.28, 1.3); speckle(ctx, size, fbmD, 0.16, 3.1);
  }
  const stone = canvasTexture(STONE.SIZE, (ctx, s) => drawStone(ctx, s, 'colour'), true);
  const stoneHeight = canvasTexture(STONE.SIZE, (ctx, s) => drawStone(ctx, s, 'height'), false);

  // --- wet basalt for the island ---------------------------------------------------
  const rock = canvasTexture(512, (ctx, s) => {
    ctx.fillStyle = '#3d4046'; ctx.fillRect(0, 0, s, s);
    const r = mulberry32(CFG.SEED ^ 0x99);
    for (let i = 0; i < 160; i++) {       // fracture lines
      ctx.strokeStyle = 'rgba(6,7,9,' + (0.25 + r() * 0.5) + ')'; ctx.lineWidth = 0.6 + r() * 2.2;
      let x = r() * s, y = r() * s; ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += (r() - 0.5) * 90; y += (r() - 0.2) * 70; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    speckle(ctx, s, fbmB, 0.6, 1); speckle(ctx, s, fbmD, 0.3, 2.3);
  }, true);

  // --- weathered painted metal (keeper, railings) ------------------------------------
  function metalPainter(base, rust, wear) {
    return (ctx, s) => {
      ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
      const r = mulberry32(CFG.SEED ^ base.length ^ (wear * 97));
      for (let i = 0; i < 46 * rust; i++) {                 // rust blooms
        const x = r() * s, y = r() * s, rad = 6 + r() * 34;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
        g.addColorStop(0, 'rgba(92,44,20,' + (0.35 + r() * 0.4) + ')'); g.addColorStop(0.6, 'rgba(70,38,22,0.18)'); g.addColorStop(1, 'rgba(70,38,22,0)');
        ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      }
      for (let i = 0; i < 150 * wear; i++) {                // scratches down to bare steel
        ctx.strokeStyle = 'rgba(' + (r() > 0.5 ? '205,208,214' : '18,18,20') + ',' + (0.1 + r() * 0.35) + ')'; ctx.lineWidth = 0.5 + r();
        const x = r() * s, y = r() * s, a = r() * TAU, l = 4 + r() * 30;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
      }
      speckle(ctx, s, fbmC, 0.22, 2);
    };
  }
  const paint = canvasTexture(256, metalPainter('#c49a3c', 1, 1), true);
  const steel = canvasTexture(256, metalPainter('#4a4f58', 0.7, 0.6), true);

  // --- soft sprites ----------------------------------------------------------------------
  const glow = canvasTexture(128, (ctx, s) => {
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.12, 'rgba(255,255,255,0.55)'); g.addColorStop(0.4, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  }, false);
  const streak = canvasTexture(128, (ctx, s) => {
    const img = ctx.createImageData(s, s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const u = (x / (s - 1)) * 2 - 1, v = (y / (s - 1)) * 2 - 1;
      const a = Math.pow(Math.max(0, 1 - Math.abs(u)), 2.2) * Math.exp(-v * v * 60);
      const i = (y * s + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;
    }
    ctx.putImageData(img, 0, 0);
  }, false);
  glow.wrapS = glow.wrapT = streak.wrapS = streak.wrapT = THREE.ClampToEdgeWrapping;

  return { noise, waterNormal, stone, stoneHeight, rock, paint, steel, glow, streak, rng };
}

/* ============================================================================
 * 4. WORLD — sky, ocean, island, lighthouse, weather, and the whale.
 *    Every element exposes `update(state)`; none of them keep time themselves.
 * ========================================================================== */
const GLSL_COMMON = /* glsl */`
  float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  vec3 fogMix(vec3 col, vec3 fogCol, float dist, float density) {
    float f = 1.0 - exp(-pow(dist * density, 1.35));
    return mix(col, fogCol, clamp(f, 0.0, 1.0));
  }
`;

const towerRadiusAt = (y) => lerp(CFG.TOWER.R_BASE, CFG.TOWER.R_TOP, sat((y - CFG.ROCK.TOP_Y) / CFG.TOWER.H));
const GALLERY_Y = CFG.ROCK.TOP_Y + CFG.TOWER.H;
const LAMP_Y = GALLERY_Y + CFG.GALLERY.LAMP_UP;
const STAIR_DTHETA = (CFG.STAIR.TURNS * TAU) / CFG.STAIR.STEPS;
/** Beam azimuth (radians from +Z towards +X) at film time t. It faces the open sea on every second bar. */
const beamAngleAt = (t) => ((t - CFG.BEAM.PHASE_T) / CFG.BEAM.PERIOD) * TAU;

function createWorld(THREE, assets, track) {
  const scene = new THREE.Scene();
  const world = { scene };
  const own = (x) => { track.push(x); return x; };
  const geo = (g) => own(g);
  const mat = (m) => own(m);

  // ---------------------------------------------------------------- lights ---
  const hemi = new THREE.HemisphereLight(0x5a7096, 0x0b0d12, 0.5);
  const moon = new THREE.DirectionalLight(0x7f9cc8, 0.35);
  moon.position.set(-60, 80, -40);
  const bolt = new THREE.DirectionalLight(0xcfe0ff, 0);
  const lampLight = new THREE.PointLight(0xffc87a, 0, 90, 1.6);
  lampLight.position.set(0, LAMP_Y, 0);
  const whaleLight = new THREE.PointLight(0x7fc8ff, 0, 260, 1.2);
  scene.add(hemi, moon, bolt, lampLight, whaleLight);

  // ------------------------------------------------------------------- sky ---
  const skyUniforms = {
    uNoise: { value: assets.noise }, uTime: { value: 0 }, uClear: { value: 0 }, uFlash: { value: 0 },
    uBoltDir: { value: new THREE.Vector3(0, 0.3, -1) },
    uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uFog: { value: new THREE.Color() },
    uLampDir: { value: new THREE.Vector3() }, uLamp: { value: 0 }
  };
  const SKY_RADIUS = 3000;
  const sky = new THREE.Mesh(geo(new THREE.SphereGeometry(SKY_RADIUS, 48, 24)), mat(new THREE.ShaderMaterial({
    uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, depthTest: false,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uNoise; uniform float uTime, uClear, uFlash, uLamp;
      uniform vec3 uBoltDir, uZenith, uHorizon, uFog, uLampDir;
      varying vec3 vDir;
      ${GLSL_COMMON}
      const float CLOUD_PLANE = 0.14, CLOUD_SCALE = 0.105;
      float starLayer(vec3 d, float cells, float cutoff, float radius) {
        vec3 p = d * cells, c = floor(p);
        float h = hash13(c);
        vec3 centre = c + 0.5 + (vec3(hash13(c + 7.1), hash13(c + 13.7), hash13(c + 29.3)) - 0.5) * 0.6;
        float twinkle = 0.75 + 0.25 * sin(uTime * (1.5 + h * 4.0) + h * 40.0);
        return step(cutoff, h) * smoothstep(radius, 0.0, length(p - centre)) * twinkle * (0.4 + 0.6 * fract(h * 57.0));
      }
      void main() {
        vec3 d = normalize(vDir);
        float h = max(d.y, 0.0);
        vec3 col = mix(uHorizon, uZenith, pow(h, 0.55));

        // stars and a faint galactic band, revealed as the storm clears
        float band = exp(-pow(dot(d, normalize(vec3(0.35, 0.55, -0.76))) * 3.2, 2.0));
        vec2 buv = vec2(atan(d.x, d.z), d.y) * 1.3;
        float dust = texture2D(uNoise, buv * 0.6).r * texture2D(uNoise, buv * 1.7 + 0.3).g;
        vec3 stars = vec3(0.85, 0.92, 1.0) * (starLayer(d, 95.0, 0.972, 0.2) * 5.0 + starLayer(d, 170.0, 0.955, 0.24) * 1.6);
        stars += band * dust * vec3(0.32, 0.36, 0.75) * 1.5 + band * starLayer(d, 240.0, 0.9, 0.3) * vec3(0.7, 0.8, 1.0) * 1.2;
        col += stars * smoothstep(0.15, 0.9, uClear) * smoothstep(0.0, 0.25, h);
        // the far horizon keeps a breath of teal once the storm has gone
        col += vec3(0.05, 0.16, 0.2) * uClear * exp(-h * 9.0);

        // storm clouds on a virtual plane, three octaves sliding at different speeds
        vec2 uv = d.xz / (h + CLOUD_PLANE) * CLOUD_SCALE;
        vec2 wind = vec2(uTime * 0.006, uTime * 0.0035);
        float n = texture2D(uNoise, uv * 0.5 + wind).r * 0.55 + texture2D(uNoise, uv * 1.3 + wind * 1.9).g * 0.3 + texture2D(uNoise, uv * 3.1 - wind * 1.4).b * 0.15;
        float cover = mix(0.3, 0.78, uClear);
        float cloud = smoothstep(cover - 0.2, cover + 0.22, n) * mix(1.0, 0.85, uClear);
        float body = smoothstep(cover, cover + 0.3, n);
        vec3 cloudCol = mix(uHorizon * 1.5 + 0.012, uZenith * 0.35, body);
        // lightning: sheet flash through the whole deck plus a hot core around the strike
        float core = pow(max(dot(d, uBoltDir), 0.0), 14.0);
        cloudCol += vec3(0.62, 0.74, 1.0) * uFlash * (0.07 + 0.75 * core) * (0.15 + 1.6 * n * n);
        // the lamp tints nearby cloud undersides
        cloudCol += vec3(1.0, 0.72, 0.38) * uLamp * 0.05 * (1.0 - body) * pow(max(dot(d, uLampDir), 0.0), 2.0);
        col = mix(col, cloudCol, cloud);
        col += vec3(0.5, 0.62, 1.0) * uFlash * core * 0.12;

        col = mix(uFog, col, smoothstep(-0.02, 0.2, d.y));
        gl_FragColor = vec4(col, 1.0);
      }`
  })));
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  // ----------------------------------------------------------------- ocean ---
  // A polar grid that travels with the camera: dense where you look, sparse at the horizon.
  const O = CFG.OCEAN, EYE = { HALF_W: 98, HALF_H: 46, IRIS_R: 43 };
  const oceanGeo = geo(new THREE.BufferGeometry());
  {
    const pos = new Float32Array((O.RINGS + 1) * O.SPOKES * 3), idx = [];
    for (let r = 0; r <= O.RINGS; r++) {
      const radius = O.INNER + (O.OUTER - O.INNER) * Math.pow(r / O.RINGS, O.RING_POWER);
      for (let s = 0; s < O.SPOKES; s++) {
        const a = (s / O.SPOKES) * TAU, i = (r * O.SPOKES + s) * 3;
        pos[i] = Math.cos(a) * (r === 0 ? 0 : radius); pos[i + 1] = 0; pos[i + 2] = Math.sin(a) * (r === 0 ? 0 : radius);
      }
    }
    for (let r = 0; r < O.RINGS; r++) for (let s = 0; s < O.SPOKES; s++) {
      const a = r * O.SPOKES + s, b = r * O.SPOKES + (s + 1) % O.SPOKES, c = a + O.SPOKES, d = b + O.SPOKES;
      idx.push(a, b, c, b, d, c);
    }
    oceanGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    oceanGeo.setIndex(idx);
  }
  const waveData = CFG.WAVES.map((w) => {
    const a = (w.dir * Math.PI) / 180, k = TAU / w.len;
    return new THREE.Vector4(Math.cos(a) * k, Math.sin(a) * k, w.amp, w.steep);
  });
  const waveSpeeds = CFG.WAVES.map((w) => Math.sqrt((CFG.GRAVITY * TAU) / w.len));
  const oceanUniforms = {
    uTime: { value: 0 }, uAmp: { value: 1 }, uStorm: { value: 1 }, uOrigin: { value: new THREE.Vector2() },
    uWaves: { value: waveData }, uSpeeds: { value: waveSpeeds },
    uNormalMap: { value: assets.waterNormal }, uNoise: { value: assets.noise },
    uZenith: skyUniforms.uZenith, uHorizon: skyUniforms.uHorizon, uFog: skyUniforms.uFog, uFlash: skyUniforms.uFlash,
    uBoltDir: skyUniforms.uBoltDir, uClear: skyUniforms.uClear,
    uFogDensity: { value: 0.004 },
    uLampPos: { value: new THREE.Vector3(0, LAMP_Y, 0) }, uLamp: { value: 0 }, uBeamDir: { value: new THREE.Vector2(0, 1) },
    uWhalePos: { value: new THREE.Vector3() }, uWhaleGlow: { value: 0 },
    uShadowPos: { value: new THREE.Vector2() }, uShadowDir: { value: new THREE.Vector2(1, 0) }, uShadow: { value: 0 },
    uBreach: { value: new THREE.Vector3(0, 0, 0) },            // x, z, strength
    uFoamR: { value: CFG.ROCK.FOAM_R }, uEye: { value: 0 }
  };
  const ocean = new THREE.Mesh(oceanGeo, mat(new THREE.ShaderMaterial({
    uniforms: oceanUniforms,
    vertexShader: /* glsl */`
      #define WAVE_COUNT ${CFG.WAVES.length}
      uniform float uTime, uAmp; uniform vec2 uOrigin;
      uniform vec4 uWaves[WAVE_COUNT]; uniform float uSpeeds[WAVE_COUNT];
      varying vec3 vWorld; varying vec3 vNormal; varying float vCrest;
      void main() {
        vec2 base = position.xz + uOrigin;
        vec3 p = vec3(base.x, 0.0, base.y);
        vec3 n = vec3(0.0, 1.0, 0.0);
        float crest = 0.0;
        // far rings cannot resolve short waves; fade them out instead of aliasing
        float reach = length(position.xz);
        for (int i = 0; i < WAVE_COUNT; i++) {
          vec2 k = uWaves[i].xy; float kl = length(k); vec2 dir = k / kl;
          float fade = 1.0 - smoothstep(18.0 / kl, 70.0 / kl, reach);
          float a = uWaves[i].z * uAmp * fade;
          float ph = dot(k, base) - uSpeeds[i] * uTime;
          float s = sin(ph), c = cos(ph);
          float q = uWaves[i].w;
          p.xz += dir * (q * a * c); p.y += a * s;
          n.xz -= dir * (kl * a * c); n.y -= q * kl * a * s;
          crest += q * kl * a * s;
        }
        vWorld = p; vNormal = n; vCrest = crest;
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime, uStorm, uFlash, uClear, uFogDensity, uLamp, uWhaleGlow, uShadow, uFoamR, uEye;
      uniform sampler2D uNormalMap, uNoise;
      uniform vec3 uZenith, uHorizon, uFog, uBoltDir, uLampPos, uWhalePos, uBreach;
      uniform vec2 uBeamDir, uShadowPos, uShadowDir;
      varying vec3 vWorld; varying vec3 vNormal; varying float vCrest;
      ${GLSL_COMMON}
      const vec3 DEEP = vec3(0.004, 0.012, 0.018);
      const vec3 SCATTER = vec3(0.012, 0.085, 0.09);
      const vec3 LAMP_COL = vec3(1.0, 0.76, 0.42);
      const vec3 STAR_COL = vec3(0.45, 0.75, 1.0);
      vec3 skyAt(vec3 r) {
        float h = max(r.y, 0.0);
        vec3 c = mix(uHorizon * 1.5 + 0.01, uZenith, pow(h, 0.5));
        c += vec3(0.62, 0.74, 1.0) * uFlash * (0.06 + 0.6 * pow(max(dot(r, uBoltDir), 0.0), 14.0));
        c += vec3(0.2, 0.28, 0.5) * uClear * 0.12;
        return c;
      }

  const STAR_TINTS = [[0.75, 0.86, 1], [0.55, 0.8, 1], [1, 1, 1], [0.6, 1, 0.95], [1, 0.86, 0.6], [0.85, 0.7, 1]];

        float ignite = 1.0 + 1.6 * smoothstep(3.5, 0.0, abs(w.x - uRevealX)) * step(uReveal, 0.999);

    fragmentShader: /* glsl */`

  const lp = [], ls = [], lf = [], seen = new Set();
  nodes.forEach((n, i) => {

  const lines = new THREE.LineSegments(lineGeo, own(new THREE.ShaderMaterial({
    uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      ${GLSL_SWIM}
      uniform float uReveal; varying float vA;
      void main() { vec4 w = modelMatrix * vec4(swim(position), 1.0); vA = revealMask(w.xyz, uReveal); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`

  const group = new THREE.Group();

      // orient along the direction of travel; a slight bias keeps the frame stable when rising vertically

/* ============================================================================
 * 5. CHARACTER — the keeper: a jointed rig posed by analytic two-bone IK.
 *    Feet are planted on real stair treads; nothing here reads the clock.
 * ========================================================================== */
const GALLERY_SPOT = { X: 0, Z: 3.98 };                       // where the keeper stands at the lever, facing the sea (+Z)
const SIT_SPOT = { X: -0.95, Z: 4.55 };
const STAIR_BASE_R = CFG.TOWER.R_BASE + CFG.STAIR.PATH_OFFSET;

/** Where the keeper is after `u` footsteps of the journey. Writes position; returns heading and per-step rise. */
const pathResult = { heading: 0, rise: 0, theta: 0 };
function keeperPath(u, out) {
  const R = CFG.ROBOT, ST = CFG.STAIR;
  if (u >= R.U_GALLERY) {                                     // a short walk along the gallery deck to the lever
    const g = sat((u - R.U_GALLERY) / R.GALLERY_STEPS);
    out.set(lerp(GALLERY_SPOT.X - R.STRIDE * R.GALLERY_STEPS, GALLERY_SPOT.X, g), GALLERY_Y, lerp(GALLERY_SPOT.Z - 0.6, GALLERY_SPOT.Z, g));
    pathResult.heading = Math.atan2(R.STRIDE * R.GALLERY_STEPS, 0.6); pathResult.rise = 0; pathResult.theta = 0;
  } else if (u <= R.U_GROUND) {                               // across the rock, tangent to the foot of the stair
    const back = (R.U_GROUND - u) * R.STRIDE, th = ST.THETA0;
    out.set(Math.sin(th) * STAIR_BASE_R - Math.cos(th) * back, CFG.ROCK.TOP_Y, Math.cos(th) * STAIR_BASE_R + Math.sin(th) * back);
    pathResult.heading = Math.atan2(Math.cos(th), -Math.sin(th)); pathResult.rise = 0; pathResult.theta = th;
  } else {                                                    // the spiral stair
    const us = Math.min(u - R.U_GROUND, ST.STEPS), th = ST.THETA0 + us * STAIR_DTHETA, y = CFG.ROCK.TOP_Y + us * ST.RISE, r = towerRadiusAt(y) + ST.PATH_OFFSET;
    out.set(Math.sin(th) * r, y, Math.cos(th) * r);
    pathResult.heading = Math.atan2(Math.cos(th), -Math.sin(th)); pathResult.rise = ST.RISE; pathResult.theta = th;
  }
  return pathResult;
}

/** Planar two-bone IK. Target is (forward, down-negative) from the root joint. `bendForward` picks knee vs elbow. */
const ikResult = { root: 0, mid: 0 };
function solveTwoBone(dz, dy, l1, l2, bendForward) {
  const reach = l1 + l2 - 0.002, d = clamp(Math.hypot(dz, dy), Math.abs(l1 - l2) + 0.02, reach);
  const aim = Math.atan2(dz, -dy);
  const inner = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const bend = Math.PI - Math.acos(clamp((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2), -1, 1));
  ikResult.root = -(aim + (bendForward ? inner : -inner));
  ikResult.mid = bendForward ? bend : -bend;
  return ikResult;
}

function createRobot(THREE, assets, track, eyeColour) {
  const R = CFG.ROBOT, own = (x) => { track.push(x); return x; };
  const paint = own(new THREE.MeshStandardMaterial({ map: assets.paint, roughness: 0.5, metalness: 0.35 }));
  const steel = own(new THREE.MeshStandardMaterial({ map: assets.steel, roughness: 0.42, metalness: 0.8, color: 0xa4a9b3 }));
  const rubber = own(new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.9 }));
  const eyeMat = own(new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const coreMat = own(new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const tipMat = own(new THREE.MeshBasicMaterial({ color: 0xff2a1a }));
  const cache = {};
  const G = (key, make) => cache[key] || (cache[key] = own(make()));
  const box = (w, h, d) => G('b' + w + '_' + h + '_' + d, () => new THREE.BoxGeometry(w, h, d));
  const cyl = (r0, r1, h, seg) => G('c' + r0 + '_' + r1 + '_' + h, () => new THREE.CylinderGeometry(r0, r1, h, seg || 12));

  const pivot = (parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };

  part(hips, cyl(0.1, 0.1, 0.5), rubber, 0, 0, 0).rotation.z = Math.PI / 2;

  // torso
  const torso = pivot(hips, 0, 0.12, 0);
  part(torso, box(0.64, 0.6, 0.42), paint, 0, 0.36, 0);
  part(torso, box(0.52, 0.1, 0.36), steel, 0, 0.03, 0);
  part(torso, box(0.38, 0.3, 0.04), steel, 0, 0.4, 0.215);
  const core = part(torso, G('core', () => new THREE.CircleGeometry(0.085, 20)), coreMat, 0, 0.41, 0.238);
  for (let i = -1; i <= 1; i++) part(torso, box(0.24, 0.018, 0.02), rubber, 0, 0.41 + i * 0.055, 0.243);
  part(torso, cyl(0.1, 0.1, 0.84), steel, 0, R.SHOULDER_H, 0).rotation.z = Math.PI / 2;
  part(torso, box(0.46, 0.44, 0.2), steel, 0, 0.36, -0.3);                        // power pack
  part(torso, cyl(0.07, 0.07, 0.4), paint, -0.13, 0.4, -0.42);
  part(torso, cyl(0.07, 0.07, 0.4), paint, 0.13, 0.4, -0.42);
  part(torso, cyl(0.06, 0.075, 0.16), rubber, 0, 0.72, 0);                        // neck
  const coreLight = new THREE.PointLight(0xffa858, 0.8, 5.5, 1.8);
  coreLight.position.set(0, 0.42, 0.5); torso.add(coreLight);

  // head: a drum with one great lens
  const head = pivot(torso, 0, 0.8, 0);
  part(head, cyl(0.2, 0.2, 0.5, 20), paint, 0, 0.2, 0).rotation.z = Math.PI / 2;
  part(head, cyl(0.1, 0.1, 0.56, 12), steel, 0, 0.2, 0).rotation.z = Math.PI / 2;
  const eyeHousing = part(head, cyl(0.125, 0.15, 0.12, 20), steel, 0, 0.2, 0.2); eyeHousing.rotation.x = Math.PI / 2;
  part(head, G('iris', () => new THREE.TorusGeometry(0.112, 0.016, 6, 24)), rubber, 0, 0.2, 0.262);
  const eye = part(head, G('eye', () => new THREE.CircleGeometry(0.1, 24)), eyeMat, 0, 0.2, 0.263);
  const pupil = part(head, G('pupil', () => new THREE.CircleGeometry(0.034, 16)), rubber, 0, 0.2, 0.2645);

  part(head, cyl(0.007, 0.007, 0.34, 5), steel, 0.15, 0.56, -0.06);
  const tip = part(head, ball(0.022), tipMat, 0.15, 0.74, -0.06);

    part(shoulder, ball(0.105), steel);
    part(shoulder, cyl(0.055, 0.05, R.UPPER_ARM), paint, 0, -R.UPPER_ARM / 2, 0);
    const elbow = pivot(shoulder, 0, -R.UPPER_ARM, 0);

    part(hand, box(0.03, 0.11, 0.035), steel, 0, -0.13, 0.04);
    part(hand, box(0.03, 0.11, 0.035), steel, 0, -0.13, -0.04);

    part(knee, box(0.1, 0.12, 0.05), steel, 0, -0.01, 0.07);
    part(knee, cyl(0.05, 0.062, R.SHIN), steel, 0, -R.SHIN / 2, 0);

    SIT_HIP_Y: 0.17, SIT_FOOT_Z: 0.48, SIT_FOOT_Y: -0.4, GAZE_YAW_MAX: 1.25, GAZE_PITCH_MIN: -0.6, GAZE_PITCH_MAX: 1.0

      torso.rotation.y = Math.sin(u * Math.PI) * 0.09 * gait * (1 - p.stand) + p.headYaw * 0.35;
      torso.rotation.z = p.stumble * 0.12;
      head.rotation.set(-p.lookUp * 0.86 + p.stumble * 0.3, p.headYaw * 0.65, p.tilt);
      brow.rotation.x = p.brow;

      for (let k = 0; k < 2; k++) {
        // each foot alternates: half a cycle planted on a tread, half swinging to the tread two up
        const cycle = fract((u - k) / 2);
        let rel, lift = 0;
        if (cycle < 0.5) rel = 0.5 - cycle * 2;
        else { const sw = (cycle - 0.5) * 2; rel = -0.5 + EASE.soft(sw); lift = Math.sin(sw * Math.PI) * (R.STEP_LIFT + p.rise * 0.6); }
        rel *= 1 - p.stand * 0.72;
        if (k === SLIP_LEG) { rel -= p.stumble * 0.95; lift *= 1 - p.stumble; }
        let footZ = rel * R.STRIDE - lurch, footY = R.FOOT_H + rel * p.rise + lift - hipY;
        if (p.sit > 0) {
          const dangle = Math.sin(p.time * 0.9 + k * 2.1) * 0.07;
          footZ = lerp(footZ, POSE.SIT_FOOT_Z + dangle, p.sit); footY = lerp(footY, POSE.SIT_FOOT_Y + Math.abs(dangle) * 0.4, p.sit);
        }
        const ik = solveTwoBone(footZ, footY, R.THIGH, R.SHIN, true), leg = legs[k];
        leg.hip.rotation.x = ik.root; leg.knee.rotation.x = ik.mid;
        leg.ankle.rotation.x = -(ik.root + ik.mid) - p.sit * 0.5 - (k === SLIP_LEG ? p.stumble * 0.7 : 0);

        const dx = p.gazeTarget.x - tmp.x, dy = p.gazeTarget.y - tmp.y - 0.2, dz = p.gazeTarget.z - tmp.z;

      eyeMat.color.copy(COLD).lerp(WARM, p.eyeWarm).multiplyScalar(p.eyeGlow * 1.05);
      eye.scale.setScalar(p.eyeScale); pupil.scale.setScalar(lerp(1, 1.5, p.eyeWarm) / Math.max(p.eyeScale, 0.5));
      coreMat.color.setRGB(1.0, 0.56, 0.2).multiplyScalar(p.coreGlow * 2.2);
      coreLight.intensity = 0.55 * p.coreGlow + 0.4 * p.eyeGlow;
      tipMat.color.setRGB(1, 0.16, 0.1).multiplyScalar(fract(p.time * 0.5) < 0.12 ? 3 : 0.15);
      root.updateMatrixWorld(true);
      eye.getWorldPosition(headWorld);
    }
  };
}

function createTimeline(THREE) {

    fade: [[0, 0], [0.45, 1], [T.BLACK - 0.04, 1], [T.BLACK, 0]],

    whaleReveal: [[T.REVEAL, 0], [T.REVEAL + 0.03, 0.25], [67.8, 0.5, lin], [T.REVEAL_DONE + 0.2, 1]],

    breach: [[56, 0], [60, 1], [76, 1], [80, 0]],
    risingShadow: [[44, 0], [47, 0.9], [58, 0.9], [63, 0]],

  // the thing in the water: a slow rise, a breach as the light finds it, then a long fall back into the dark
  const WHALE_START = 45;
  const WHALE_PATH = [[45, 12, -74, 99], [48, 12, -66, 99], [51, 11, -55, 98], [54, 11, -43, 98], [57, 10, -30, 97], [60, 10, -17, 97], [63, 10, -5, 96], [66, 9, 8, 96],
    [69, 4, 15, 93], [72, -4, 17, 90], [75, -14, 7, 88], [78, -26, -20, 88], [81, -36, -62, 90], [84, -40, -95, 92], [87, -42, -120, 94], [90, -44, -140, 96]];
  // who: a = Keeper Seven, b = the other one, sys = the tower's own protocol
  const SUBTITLES = [
    { a: 3.2, b: 5.7, who: 'a', text: '…I did not turn that off.' },
    { a: 9.3, b: 11.8, who: 'sys', text: 'PROTOCOL 1 — IF THE LAMP IS DARK FOR 60 SECONDS, CONTAINMENT ENDS.' },
    { a: 12.8, b: 17.2, who: 'a', text: 'Containment of what? The file is nine hundred years old.\nNobody wrote that part down.' },
    { a: 18.5, b: 20.8, who: 'a', text: '…Oh.' },
    { a: 26.4, b: 29.6, who: 'a', text: 'There is someone standing at the lamp.' },
    { a: 33.5, b: 35.7, who: 'a', text: 'Identify yourself.' },
    { a: 36.3, b: 38.7, who: 'b', text: 'Keeper Seven.' },
    { a: 39.3, b: 41.6, who: 'a', text: 'That is my name.' },
    { a: 42.2, b: 44.8, who: 'b', text: 'It was mine first.\nI turned the light off.' },
    { a: 45.4, b: 48.4, who: 'a', text: 'The window closes in twenty seconds. Move.' },
    { a: 49.0, b: 52.2, who: 'b', text: 'Let it close.\nYou have never seen what the light is for.' },
    { a: 52.7, b: 54.6, who: 'a', text: 'It keeps them away.' },
    { a: 55.1, b: 57.8, who: 'b', text: 'That is what I believed. For four hundred years.' },
    { a: 58.4, b: 60.1, who: 'a', text: 'Let go of the lever.' },
    { a: 60.7, b: 62.4, who: 'b', text: 'Don’t.' },
    { a: 67.0, b: 69.0, who: 'a', text: '…It is beautiful.' },
    { a: 69.6, b: 71.9, who: 'b', text: 'Keep watching.' },
    { a: 75.2, b: 77.8, who: 'b', text: 'The light does not guide them. It puts them out.\nThat was the last one.' },
    { a: 78.3, b: 80.2, who: 'a', text: 'Then what have we been keeping…' },
    { a: 80.6, b: 82.4, who: 'b', text: 'Fed.' }
  ];
  const CARDS = [
    { a: 0.25, b: 2.45, title: 'Rule One', sub: 'The light never goes out' },
    { a: 6.3, b: 8.8, title: 'Sixty Seconds of Dark', sub: SERIES.NAME + ' · Part One' }
  ];
  const SUB_FADE = 0.25, CARD_FADE = 0.3;

  const s = {
    t: 0, storm: 1, rain: 1, clear: 0, lamp: 0, lampSpark: 0, lever: LEVER_OFF, beamAngle: 0, flash: flashState, exposure: 1, fade: 0, saturation: 1,
    whalePos: new THREE.Vector3(), whaleDir: new THREE.Vector3(0, 0, 1), whaleRoll: 0, whaleVisible: false, whaleReveal: 0, whaleGlow: 1, revealX: -1e4, douseX: -1e4,
    shadowPos: new THREE.Vector3(), shadowDir: new THREE.Vector3(1, 0, 0), shadow: 0, breachPos: new THREE.Vector3(BREACH.X, 0, BREACH.Z), breach: 0, eyeOpen: 0,
    pointScale: 600, titleOpacity: 0, cardTitle: '', cardSub: '', endOpacity: 0, subtitle: '', subtitleOpacity: 0, subtitleWho: 'a',
    hudOpacity: 0, hudSeconds: 60, hudMode: 'count',
    robot: makePose(THREE), robotB: makePose(THREE), bHead: new THREE.Vector3(OTHER_SPOT.X, GALLERY_Y + HEAD_UP, OTHER_SPOT.Z)

  const SPLINE_EPS = 0.12;

  function evaluate(t) {
    const k = (name) => sampleTrack(K[name], t), r = s.robot, b = s.robotB;
    s.t = t;
    evalFlash(t);
    s.storm = k('storm'); s.rain = k('rain'); s.clear = 0; s.lamp = k('lamp'); s.lampSpark = k('lampSpark'); s.lever = k('lever');
    s.beamAngle = beamAngleAt(t); s.exposure = k('exposure'); s.fade = k('fade'); s.saturation = k('saturation');

    // the thing in the water
    s.whaleVisible = t >= WHALE_START;
    const wt = Math.max(t, WHALE_START);
    sampleSpline(WHALE_PATH, wt, s.whalePos);
    sampleSpline(WHALE_PATH, wt + SPLINE_EPS, ahead); sampleSpline(WHALE_PATH, wt - SPLINE_EPS, behind);
    s.whaleDir.copy(ahead).sub(behind);
    if (s.whaleDir.lengthSq() < 1e-6) s.whaleDir.set(0, 1, 0);

    s.douseX = t < T.DOUSE ? -1e4 : t > T.DOUSE_DONE ? 1e4 : k('douseX');
    s.whaleGlow = 1 - smooth(T.DOUSE + 0.4, T.DOUSE_DONE, t);          // drives the starlight cast on sea and tower
    s.breach = k('breach'); s.eyeOpen = k('eyeOpen');

    // Keeper Seven
    r.u = k('u'); r.time = t;
    const path = keeperPath(r.u, r.pos);
    r.heading = lerp(path.heading, 0, k('yawTurn')); r.rise = path.rise;
    r.stumble = k('stumble'); r.lean = k('lean'); r.lookUp = k('lookUp'); r.brow = k('brow');
    r.gaze = k('gaze'); r.stand = k('stand'); r.reachLever = k('reachLever'); r.recoil = k('recoil');
    r.eyeWarm = k('eyeWarm'); r.eyeScale = k('eyeScale'); r.coreGlow = k('coreGlow') * (1 + 0.1 * Math.sin(t * TAU / BEAT));
    const fear = Math.max(r.stumble, r.recoil, smooth(60, 65, t) * (1 - smooth(T.IGNITE, T.IGNITE + 0.5, t)) * 0.6);
    r.eyeGlow = 1 - 0.45 * fear * (0.5 + 0.5 * Math.sin(t * 31) * Math.sin(t * 17.3));
    r.gazeTarget.copy(s.bHead).lerp(s.whalePos, k('lookSea')).lerp(seaBelow, k('lookDown'));

    // the other keeper: already at the lever when the film begins, holding it down
    b.pos.set(OTHER_SPOT.X, GALLERY_Y, OTHER_SPOT.Z); b.heading = OTHER_SPOT.HEADING; b.u = R.U_GALLERY + R.GALLERY_STEPS; b.time = t + 3.3; b.stand = 1;
    b.reachLever = k('bLever'); b.reachOut = k('bStop'); b.recoil = k('bRecoil'); b.tilt = k('bTilt'); b.brow = 0.16; b.eyeScale = 0.7;

    else if (t < 21) { s.shadow = 1; s.shadowPos.set(lerp(-78, 52, (t - 18) / 3), 0, lerp(47, 31, (t - 18) / 3)); s.shadowDir.set(0.992, 0, -0.122); }
    else { s.shadow = k('risingShadow'); s.shadowPos.set(BREACH.X, 0, BREACH.Z); s.shadowDir.set(0, 0, 1); }

    // overlays
    s.titleOpacity = 0;
    for (let i = 0; i < CARDS.length; i++) {
      const c = CARDS[i];
      if (t >= c.a && t <= c.b) { s.cardTitle = c.title; s.cardSub = c.sub; s.titleOpacity = pulse(t, c.a, c.a + CARD_FADE, c.b - CARD_FADE * 0.4, c.b); }
    }
    s.endOpacity = smooth(T.END_CARD, T.END_CARD + 0.9, t);
    s.subtitleOpacity = 0;
    for (let i = 0; i < SUBTITLES.length; i++) {
      const sub = SUBTITLES[i];
      if (t >= sub.a && t <= sub.b) { s.subtitle = sub.text; s.subtitleWho = sub.who; s.subtitleOpacity = pulse(t, sub.a, sub.a + SUB_FADE, sub.b - SUB_FADE, sub.b); }
    }
    // the countdown that runs in real time through the whole film
    s.hudSeconds = clamp(T.TIMER_ZERO - Math.min(t, T.IGNITE), 0, 60);
    s.hudMode = t >= T.EYE_OPEN + 0.8 ? 'failed' : t >= T.IGNITE ? 'held' : 'count';
    s.hudOpacity = (smooth(4.6, 5.2, t) * (1 - smooth(68, 69, t)) + smooth(T.EYE_OPEN + 0.8, T.EYE_OPEN + 1.0, t)) * (t < T.BLACK ? 1 : 0);
    return s;
  }

  /** Footfall times, found by walking the `u` track — used to place footstep sounds exactly under the feet. */
  function footfalls() {
    const hits = [], STEP = 1 / 120;
    let prev = sampleTrack(K.u, 0);
    for (let t = STEP; t < CFG.DURATION; t += STEP) {
      const u = sampleTrack(K.u, t);
      if (u - prev > 0 && u - prev < 0.5 && Math.floor(u) !== Math.floor(prev)) hits.push({ t, metal: u >= R.U_GALLERY, stairs: u > R.U_GROUND && u < R.U_GALLERY });
      prev = u;
    }
    return hits;
  }
  return { state: s, evaluate, footfalls, sample: (name, t) => sampleTrack(K[name], t) };
}

/* ============================================================================
 * 7. CAMERA — twenty-two shots, most of them three seconds long. Each is a
 *    pure function of its own progress; a shared rig adds handheld drift,
 *    thunder rattle and focus.

function createCameraSystem(THREE, camera) {
  const v = () => new THREE.Vector3();

  function frameAt(u, pos) {
    const p = keeperPath(u, pos);

  }
