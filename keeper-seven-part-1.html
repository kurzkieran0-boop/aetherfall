    openA: P(-62, 6.5, 168), openB: P(-52, 7.5, 150), openT: P(0, 23, 0),
    craneA: P(8, 6.5, 23), craneB: P(13.5, 18, 29), top: P(0, 31, 0),
    downA: P(6, 128, 2), downB: P(2, 114, 6), downT: P(0, 0, 40),
    figure: P(0.7, 36.75, 4.2),
    dollyA: P(5.8, 36.9, 11), dollyB: P(3.0, 36.6, 8.2), dollyT: P(0.45, 36.4, 4.1),
    onB: P(-0.42, 36.95, 5.15), onA: P(1.75, 36.98, 5.1),
    twoA: P(0.2, 36.55, 10.2), twoB: P(0.55, 36.6, 8.0), twoT: P(0.5, 36.5, 4),
    sideA: P(4.6, 36.7, 7.6), sideB: P(4.2, 36.65, 7.2),
    seaA: P(-2.45, 37.45, -0.1), seaB: P(-2.3, 37.3, 0.5), seaT: P(30, 4, 97),
    insertA: P(-1.25, 36.2, 5.45), insertB: P(-1.05, 36.24, 5.3),
    teleA: P(-7, 38.5, 7), teleB: P(-6, 38.2, 9),
    eyeA: P(0, 150, -9), eyeB: P(0, 178, -7), eyeT: P(0, 0, 1)
  };
  const onFace = (camMark, face, push) => { rig.pos.copy(camMark).lerp(face, push); rig.tgt.copy(face); rig.dof = 1; rig.focus = rig.pos.distanceTo(face); rig.shake = 0.03; };

  const SHOTS = [
    { name: 'Rule one', type: 'WIDE', start: 0, end: 3, fn(u) {
      mix3(rig.pos, C.openA, C.openB, u); rig.tgt.copy(C.openT); rig.fov = 30; rig.dof = 0.1; rig.shake = 0.1;
    } },
    { name: 'It went out', type: 'CLOSE-UP, LOW', start: 3, end: 6, fn(u, s, head) {
      frameAt(CFG.ROBOT.U_GROUND, a);
      rig.pos.copy(a).addScaledVector(fwd, 1.75 - u * 0.2).addScaledVector(outw, 1.5).setY(a.y + 1.2);
      rig.tgt.copy(head); rig.tgt.y += 0.08; rig.fov = 31; rig.dof = 0.9; rig.shake = 0.05; rig.focus = rig.pos.distanceTo(head);
    } },
    { name: 'Run', type: 'CRANE UP', start: 6, end: 9, fn(u, s) {
      const e = EASE.inOut(u);
      mix3(rig.pos, C.craneA, C.craneB, e); a.copy(s.robot.pos); a.y += 1.2;
      mix3(rig.tgt, a, C.top, e * 0.8); rig.fov = lerp(40, 34, e); rig.dof = 0.2; rig.shake = 0.1;
    } },
    { name: 'Two steps a second', type: 'TRACKING, LOW', start: 9, end: 12, fn(u, s) {
      frameAt(s.robot.u, a);
      rig.pos.copy(a).addScaledVector(outw, 2.5).addScaledVector(fwd, 1.9 - u * 0.3); rig.pos.y += 0.2;
      rig.tgt.copy(a).addScaledVector(fwd, 0.2); rig.tgt.y += 0.42; rig.fov = 36; rig.dof = 1; rig.shake = 0.12;
    } },
    { name: 'Something circling', type: 'WIDE ORBIT', start: 12, end: 18, fn(u) {
      const ang = lerp(3.32, 3.98, u), rad = lerp(84, 70, u);
      rig.pos.set(Math.sin(ang) * rad, lerp(31, 23, u), Math.cos(ang) * rad);
      rig.tgt.set(0, lerp(21, 18, u), 8); rig.fov = 34; rig.dof = 0.12; rig.shake = 0.18;
    } },
    { name: 'That is what', type: 'TOP-DOWN', start: 18, end: 21, fn(u) {
      mix3(rig.pos, C.downA, C.downB, u); rig.tgt.copy(C.downT); rig.fov = 40; rig.roll = lerp(-0.1, 0.06, u); rig.dof = 0.08; rig.shake = 0.08;
    } },
    { name: 'The fall', type: 'MEDIUM, HANDHELD', start: 21, end: 25.5, fn(u, s, head, t) {
      frameAt(72, a);
      rig.pos.copy(a).addScaledVector(outw, 5.4).addScaledVector(fwd, 2.3); rig.pos.y += 1.0 - s.robot.stumble * 0.25;
      b.copy(s.robot.pos); b.y += 1.15 - s.robot.stumble * 0.45; rig.tgt.copy(b);
      rig.fov = 38 - smooth(0.4, 1, u) * 3; rig.dof = 0.5; rig.focus = rig.pos.distanceTo(b);
      rig.shake = 0.22 + (t >= CFG.T.STUMBLE ? 2.4 * Math.exp(-(t - CFG.T.STUMBLE) * 2.6) : 0);
    } },
    { name: 'Someone at the lamp', type: 'LOW ANGLE, SLOW ZOOM', start: 25.5, end: 30, fn(u) {
      frameAt(72, a);
      rig.pos.copy(a).addScaledVector(outw, 13).addScaledVector(fwd, -1.5); rig.pos.y += 7;
      rig.tgt.copy(C.figure); rig.fov = lerp(30, 9.5, EASE.inOut(u)); rig.dof = 0.15; rig.shake = 0.1;
    } },
    { name: 'Identify yourself', type: 'DOLLY IN', start: 30, end: 36, fn(u, s) {
      const e = EASE.soft(u);
      mix3(rig.pos, C.dollyA, C.dollyB, e); rig.tgt.copy(C.dollyT); rig.fov = lerp(35, 30, e); rig.dof = 0.7; rig.shake = 0.07;
      rig.focus = rig.pos.distanceTo(C.dollyT);
    } },
    { name: 'Keeper Seven', type: 'CLOSE-UP', start: 36, end: 39, fn(u, s) { onFace(C.onB, s.bHead, u * 0.12); rig.fov = 27; } },
    { name: 'That is my name', type: 'CLOSE-UP, REVERSE', start: 39, end: 42, fn(u, s, head) { onFace(C.onA, head, u * 0.1); rig.fov = 27; } },
    { name: 'I turned it off', type: 'TWO-SHOT', start: 42, end: 45, fn(u) {
      mix3(rig.pos, C.twoA, C.twoB, u * 0.3); rig.tgt.copy(C.twoT); rig.fov = 30; rig.dof = 0.5; rig.focus = 6; rig.shake = 0.05;
    } },
    { name: 'Twenty seconds', type: 'OVER THE SHOULDER', start: 45, end: 51, fn(u) {
      mix3(rig.pos, C.seaA, C.seaB, u); rig.tgt.copy(C.seaT); rig.tgt.y += u * 8;
      rig.fov = lerp(47, 43, u); rig.dof = 0.3; rig.focus = 100; rig.shake = 0.12 + u * 0.1;
    } },
    { name: 'Let it close', type: 'CLOSE-UP', start: 51, end: 54, fn(u, s) { onFace(C.onB, s.bHead, 0.12 + u * 0.1); rig.fov = 26; } },
    { name: 'Four hundred years', type: 'CLOSE-UP, REVERSE', start: 54, end: 57, fn(u, s, head) { onFace(C.onA, head, 0.1 + u * 0.12); rig.fov = 26; rig.shake = 0.06; } },
    { name: 'Let go', type: 'TWO-SHOT, PUSH IN', start: 57, end: 63, fn(u) {
      mix3(rig.pos, C.twoA, C.twoB, 0.3 + EASE.soft(u) * 0.7); rig.tgt.copy(C.twoT); rig.fov = lerp(30, 26, u); rig.dof = 0.6; rig.focus = rig.pos.distanceTo(C.twoT) - 0.3; rig.shake = 0.06 + u * 0.1;
    } },
    { name: 'Three. Two. One.', type: 'INSERT', start: 63, end: 66, fn(u, s, head, t, lever) {
      mix3(rig.pos, C.insertA, C.insertB, u); rig.tgt.copy(lever).lerp(s.bHead, 0.22); rig.fov = 33; rig.dof = 1; rig.focus = rig.pos.distanceTo(lever);
      rig.shake = 0.12 + u * 0.25 + (t >= CFG.T.IGNITE ? 1.2 * Math.exp(-(t - CFG.T.IGNITE) * 6) : 0);
    } },
    { name: 'It is beautiful', type: 'OVER THE SHOULDER', start: 66, end: 69, fn(u, s) {
      mix3(rig.pos, C.seaB, C.seaA, u); rig.tgt.copy(C.seaT); rig.tgt.y += 12; rig.fov = lerp(43, 40, u); rig.dof = 0.3; rig.focus = 100; rig.shake = 0.05; rig.rattle = 0.3;
    } },
    { name: 'Keep watching', type: 'CLOSE-UP', start: 69, end: 72, fn(u, s) { onFace(C.onB, s.bHead, 0.2 + u * 0.08); rig.fov = 25; } },
    { name: 'The second pass', type: 'TELEPHOTO', start: 72, end: 75, fn(u, s) {
      mix3(rig.pos, C.teleA, C.teleB, u); rig.tgt.copy(s.whalePos); rig.tgt.y += 5; rig.fov = lerp(31, 28, EASE.out(u)); rig.dof = 0.1; rig.shake = 0.06; rig.rattle = 0.3;
    } },
    { name: 'The last one', type: 'TWO-SHOT', start: 75, end: 78, fn(u) {
      mix3(rig.pos, C.sideA, C.sideB, u); rig.tgt.copy(C.twoT); rig.tgt.y += 0.25; rig.fov = 27; rig.dof = 0.6; rig.focus = rig.pos.distanceTo(C.twoT) - 0.3; rig.shake = 0.04;
    } },
    { name: 'Fed', type: 'TOP-DOWN, RISING', start: 78, end: CFG.DURATION, fn(u, s, head, t) {
      const e = sat((t - 78) / (CFG.T.BLACK - 78));
      mix3(rig.pos, C.eyeA, C.eyeB, EASE.soft(e)); rig.tgt.copy(C.eyeT); rig.fov = 44; rig.roll = lerp(0.12, -0.05, e); rig.dof = 0.05;
      rig.shake = 0.05 + s.eyeOpen * 0.5; rig.rattle = 0;
    } }
  ];

  const SHAKE = { POS: 0.085, ROLL: 0.006, FLASH: 0.5 };
  let current = 0;
  return {
    shots: SHOTS, rig,
    shotIndexAt(t) { for (let i = SHOTS.length - 1; i >= 0; i--) if (t >= SHOTS[i].start) return i; return 0; },
    update(t, s, head, lever) {
      current = this.shotIndexAt(t);
      const shot = SHOTS[current];
      rig.roll = 0; rig.focus = 0; rig.rattle = 1;
      shot.fn(sat((t - shot.start) / (shot.end - shot.start)), s, head, t, lever);
      const amp = rig.shake + s.flash.value * SHAKE.FLASH * rig.rattle * s.storm, seed = current + 1;
      camera.position.set(rig.pos.x + wobble(t * 2.1, seed) * amp * SHAKE.POS, rig.pos.y + wobble(t * 2.6, seed + 9) * amp * SHAKE.POS, rig.pos.z + wobble(t * 1.9, seed + 17) * amp * SHAKE.POS);
      camera.up.copy(up);
      camera.lookAt(rig.tgt.x + wobble(t * 1.5, seed + 31) * amp * SHAKE.POS * 2, rig.tgt.y + wobble(t * 1.8, seed + 43) * amp * SHAKE.POS * 2, rig.tgt.z);
      camera.rotateZ(rig.roll + wobble(t * 1.3, seed + 5) * amp * SHAKE.ROLL);
      if (camera.fov !== rig.fov) { camera.fov = rig.fov; camera.updateProjectionMatrix(); }
      camera.updateMatrixWorld(true);
      if (rig.focus <= 0) rig.focus = rig.pos.distanceTo(rig.tgt);
      return current;
    }
  };
}

/* ============================================================================
 * 8. POST-PROCESSING — HDR scene → depth-of-field → bloom (tight + wide
 *    anamorphic) → exposure → ACES → grade → vignette → grain.
 * ========================================================================== */
function createPost(THREE, renderer, track) {
  const P = CFG.POST, own = (x) => { track.push(x); return x; };
  const gl = renderer.getContext(), isGL2 = renderer.capabilities.isWebGL2;
  const hdr = isGL2 && !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  const hasDepth = isGL2 || !!gl.getExtension('WEBGL_depth_texture');
  const type = hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const target = (withDepth) => {
    const rt = own(new THREE.WebGLRenderTarget(4, 4, { type, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: !!withDepth, stencilBuffer: false }));
    rt.texture.generateMipmaps = false;
    if (withDepth && hasDepth) { rt.depthTexture = own(new THREE.DepthTexture(4, 4)); rt.depthTexture.type = isGL2 ? THREE.UnsignedIntType : THREE.UnsignedShortType; }
    return rt;
  };
  const rtScene = target(true), rtHalf = target(), rtQA = target(), rtQB = target(), rtEA = target(), rtEB = target(), rtSA = target(), rtSB = target();
  const chain = [[rtHalf, 2], [rtQA, 4], [rtQB, 4], [rtEA, 8], [rtEB, 8], [rtSA, 16], [rtSB, 16]];

  const tri = own(new THREE.BufferGeometry());
  tri.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
  const VERT = /* glsl */`varying vec2 vUv; void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const pass = (uniforms, fragmentShader) => own(new THREE.ShaderMaterial({ uniforms, vertexShader: VERT, fragmentShader, depthTest: false, depthWrite: false }));

  const copyMat = pass({ tMap: { value: null }, uTexel: { value: new THREE.Vector2() } }, /* glsl */`
    uniform sampler2D tMap; uniform vec2 uTexel; varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tMap, vUv + uTexel * vec2(-0.5, -0.5)).rgb + texture2D(tMap, vUv + uTexel * vec2(0.5, -0.5)).rgb
             + texture2D(tMap, vUv + uTexel * vec2(-0.5, 0.5)).rgb + texture2D(tMap, vUv + uTexel * vec2(0.5, 0.5)).rgb;
      gl_FragColor = vec4(min(c * 0.25, vec3(64.0)), 1.0);
    }`);
  const brightMat = pass({ tMap: { value: null }, uExposure: { value: 1 } }, /* glsl */`
    uniform sampler2D tMap; uniform float uExposure; varying vec2 vUv;
    void main() {
      vec3 c = texture2D(tMap, vUv).rgb * uExposure;
      float l = max(c.r, max(c.g, c.b));
      float soft = clamp(l - ${(P.BLOOM_THRESHOLD - P.BLOOM_KNEE).toFixed(3)}, 0.0, ${(2 * P.BLOOM_KNEE).toFixed(3)});
      float w = max(soft * soft / ${(4 * P.BLOOM_KNEE).toFixed(3)}, l - ${P.BLOOM_THRESHOLD.toFixed(3)}) / max(l, 1e-4);
      gl_FragColor = vec4(c * max(w, 0.0), 1.0);
    }`);
  const blurMat = pass({ tMap: { value: null }, uDir: { value: new THREE.Vector2() } }, /* glsl */`
    uniform sampler2D tMap; uniform vec2 uDir; varying vec2 vUv;
    void main() {
      // 9-tap Gaussian folded into 5 bilinear fetches
      vec3 c = texture2D(tMap, vUv).rgb * 0.227027;
      c += (texture2D(tMap, vUv + uDir * 1.384615).rgb + texture2D(tMap, vUv - uDir * 1.384615).rgb) * 0.316216;
      c += (texture2D(tMap, vUv + uDir * 3.230769).rgb + texture2D(tMap, vUv - uDir * 3.230769).rgb) * 0.070270;
      gl_FragColor = vec4(c, 1.0);
    }`);
  const finalUniforms = {
    tScene: { value: rtScene.texture }, tDepth: { value: rtScene.depthTexture || null }, tBlur: { value: rtQB.texture }, tBloomA: { value: rtEA.texture }, tBloomB: { value: rtSA.texture },
    uFocus: { value: 10 }, uDof: { value: 0 }, uExposure: { value: 1 }, uFade: { value: 1 }, uTime: { value: 0 }, uSaturation: { value: 1 }, uGlare: { value: 0 },
    uRes: { value: new THREE.Vector2(1, 1) }
  };
  const finalMat = pass(finalUniforms, /* glsl */`
    uniform sampler2D tScene, tDepth, tBlur, tBloomA, tBloomB;
    uniform float uFocus, uDof, uExposure, uFade, uTime, uSaturation, uGlare; uniform vec2 uRes; varying vec2 vUv;
    const float NEAR = ${CFG.RENDER.NEAR.toFixed(2)}, FAR = ${CFG.RENDER.FAR.toFixed(1)};
    vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
    void main() {
      vec2 c = vUv - 0.5;
      float edge = dot(c, c);
      // lens: lateral chromatic aberration grows towards the corners
      vec2 ca = c * edge * ${(P.CHROMA * 8).toFixed(5)};
      vec3 sharp = vec3(texture2D(tScene, vUv + ca).r, texture2D(tScene, vUv).g, texture2D(tScene, vUv - ca).b);
      vec3 col = sharp;
      ${hasDepth ? /* glsl */`
      float d = texture2D(tDepth, vUv).x * 2.0 - 1.0;
      float z = 2.0 * NEAR * FAR / (FAR + NEAR - d * (FAR - NEAR));
      float coc = smoothstep(0.0, 1.0, abs(z - uFocus) / (uFocus * ${P.DOF_RANGE.toFixed(2)})) * uDof;
      col = mix(sharp, texture2D(tBlur, vUv).rgb, coc);` : ''}
      col *= uExposure;
      vec3 bloom = texture2D(tBloomA, vUv).rgb * ${P.BLOOM_NEAR.toFixed(2)} + texture2D(tBloomB, vUv).rgb * ${P.BLOOM_WIDE.toFixed(2)};
      col += bloom + vec3(1.0, 0.8, 0.55) * uGlare * (0.05 + 0.1 * (1.0 - edge * 2.0));
      // grade: cool shadows, protected warm highlights
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, uSaturation);
      col *= mix(vec3(0.9, 0.98, 1.1), vec3(1.04, 1.0, 0.95), smoothstep(0.0, 0.6, l));
      col = pow(aces(col), vec3(1.0 / 2.2));
      col *= 1.0 - ${P.VIGNETTE.toFixed(2)} * smoothstep(0.12, 0.7, edge + c.y * c.y * 0.8);
      float g = hash(vUv * uRes + fract(uTime * 7.31) * 173.0) - 0.5;
      col += g * ${P.GRAIN.toFixed(3)} * (1.0 - 0.6 * dot(col, vec3(0.333)));
      gl_FragColor = vec4(col * uFade, 1.0);
    }`);

  const quad = new THREE.Mesh(tri, copyMat); quad.frustumCulled = false;
  const quadScene = new THREE.Scene(); quadScene.add(quad);
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  let width = 4, height = 4;
  function draw(material, dst) { quad.material = material; renderer.setRenderTarget(dst); renderer.render(quadScene, quadCam); }
  function blur(src, dst, dx, dy) { blurMat.uniforms.tMap.value = src.texture; blurMat.uniforms.uDir.value.set(dx / src.width, dy / src.height); draw(blurMat, dst); }
  const WIDE_STRETCH = 2.6;

  return {
    hdr, hasDepth,
    get height() { return height; },
    setSize(w, h) {
      width = w; height = h;
      rtScene.setSize(w, h);
      chain.forEach(([rt, div]) => rt.setSize(Math.max(2, Math.round(w / div)), Math.max(2, Math.round(h / div))));
      finalUniforms.uRes.value.set(w, h);
    },
    render(scene, camera, s, rig, glare) {
      renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
      copyMat.uniforms.tMap.value = rtScene.texture; copyMat.uniforms.uTexel.value.set(1 / width, 1 / height); draw(copyMat, rtHalf);
      blur(rtHalf, rtQA, 1.2, 0); blur(rtQA, rtQB, 0, 1.2);                     // soft copy of the scene for defocus
      brightMat.uniforms.tMap.value = rtQB.texture; brightMat.uniforms.uExposure.value = s.exposure; draw(brightMat, rtEA);
      blur(rtEA, rtEB, 1, 0); blur(rtEB, rtEA, 0, 1);                           // tight bloom
      copyMat.uniforms.tMap.value = rtEA.texture; copyMat.uniforms.uTexel.value.set(1 / rtEA.width, 1 / rtEA.height); draw(copyMat, rtSA);
      blur(rtSA, rtSB, WIDE_STRETCH, 0); blur(rtSB, rtSA, 0, 1);                // wide bloom, stretched like an anamorphic lens
      finalUniforms.uFocus.value = rig.focus; finalUniforms.uDof.value = rig.dof; finalUniforms.uExposure.value = s.exposure; finalUniforms.uFade.value = s.fade;
      finalUniforms.uTime.value = s.t; finalUniforms.uSaturation.value = s.saturation; finalUniforms.uGlare.value = glare;
      draw(finalMat, null);
    }
  };
}

/* ============================================================================
 * 9. AUDIO — a small synthesiser and a score, both pure WebAudio. Nothing is
 *    pre-rendered: voices are scheduled a moment ahead of the film clock, so
 *    seeking simply re-schedules from the new position.
 * ========================================================================== */
const NOTE_INDEX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function hz(name) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  const midi = NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function createSynth(ctx, destination) {
  const A = CFG.AUDIO, rng = mulberry32(CFG.SEED ^ 0xA0D10);
  const gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const filter = (type, f, q) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q || 0.7; return n; };

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 14; comp.ratio.value = 3.5; comp.attack.value = 0.006; comp.release.value = 0.28;
  const master = gain(A.MASTER), filmGain = gain(0);
  filmGain.connect(comp); comp.connect(master); master.connect(destination);

  function buffer(seconds, fill) {
    const n = Math.floor(seconds * ctx.sampleRate), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) fill(b.getChannelData(ch), n);
    return b;
  }
  const white = buffer(A.NOISE_SECONDS, (d, n) => { for (let i = 0; i < n; i++) d[i] = rng() * 2 - 1; });
  const brown = buffer(A.NOISE_SECONDS, (d, n) => { let v = 0; for (let i = 0; i < n; i++) { v = (v + (rng() * 2 - 1) * 0.02) / 1.02; d[i] = v * 3.5; } });
  // reverb: a synthesised hall — decaying noise with a darker tail
  const reverb = ctx.createConvolver();
  reverb.buffer = buffer(A.REVERB_SECONDS, (d, n) => { let lp = 0; for (let i = 0; i < n; i++) { const x = i / n; lp += ((rng() * 2 - 1) - lp) * (0.75 - 0.6 * x); d[i] = lp * Math.pow(1 - x, 2.6); } });
  const wet = gain(0.55); reverb.connect(wet); wet.connect(filmGain);

  // session buses: replaced wholesale on every seek so stale voices vanish at once
  let dry = null, send = null;
  const live = new Set();
  function openSession() { dry = gain(1); dry.connect(filmGain); send = gain(1); send.connect(reverb); }
  function closeSession(when) {
    live.forEach((n) => { try { n.stop(when); } catch (e) { /* already stopped */ } });
    live.clear();
    if (dry) { const d = dry, s = send; d.gain.setTargetAtTime(0, when, 0.01); s.gain.setTargetAtTime(0, when, 0.01); setTimeout(() => { d.disconnect(); s.disconnect(); }, 400); }
    dry = send = null;
  }
  const keep = (node) => { live.add(node); node.onended = () => live.delete(node); return node; };
  function osc(type, freq, when, stop) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, when); o.start(when); o.stop(stop); return keep(o); }
  function noise(buf, when, stop, rate) { const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true; n.playbackRate.value = rate || 1; n.start(when, rng() * (A.NOISE_SECONDS - 0.5)); n.stop(stop); return keep(n); }
  /** Output stage of a voice: level, pan, reverb send. */
  function out(node, level, wetAmount, pan) {
    const g = gain(level); node.connect(g);
    let tail = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
    tail.connect(dry);
    if (wetAmount) { const w = gain(wetAmount); tail.connect(w); w.connect(send); }
  }
  function adsr(when, attack, peak, hold, release) {
    const g = gain(0); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.setValueAtTime(peak, when + attack + hold); g.gain.linearRampToValueAtTime(0, when + attack + hold + release);
    return g;
  }
  function decay(when, attack, peak, tau) { const g = gain(0); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + attack); g.gain.setTargetAtTime(0, when + attack, tau); return g; }

  const I = {
    bell(when, f, vel, pan) {
      const end = when + 4.5, e = decay(when, 0.004, vel, 0.75);
      osc('sine', f, when, end).connect(e);
      const h = gain(0.3); osc('sine', f * 2.0, when, end).connect(h); h.connect(e);
      const i = decay(when, 0.003, vel * 0.14, 0.22); osc('sine', f * 3.01, when, end).connect(i); out(i, 1, 0.5, pan);
      out(e, 0.5, 0.6, pan);
    },
    pluck(when, f, vel, pan) {
      const end = when + 1.4, lp = filter('lowpass', 2400, 1.2), e = decay(when, 0.005, vel, 0.2);
      lp.frequency.setValueAtTime(3200, when); lp.frequency.setTargetAtTime(500, when, 0.16);
      osc('triangle', f, when, end).connect(lp); const s = gain(0.25); osc('sawtooth', f * 1.003, when, end).connect(s); s.connect(lp);
      lp.connect(e); out(e, 0.5, 0.35, pan);
    },
    pad(when, freqs, dur, vel, cutoff, release, late) {
      const d = Math.max(0.2, dur - (late || 0)), attack = late ? 0.15 : Math.min(1.1, d * 0.4), rel = release || 1.5;
      const lp = filter('lowpass', cutoff, 0.5), e = adsr(when, attack, vel, d - attack, rel), end = when + d + rel + 0.1;
      freqs.forEach((f, k) => {
        const a = osc('sawtooth', f, when, end), b = osc('sawtooth', f, when, end);
        a.detune.value = -7 - k; b.detune.value = 8 + k;
        a.connect(lp); b.connect(lp);
      });
      lp.connect(e); out(e, 0.22 / Math.sqrt(freqs.length), 0.6);
    },
    lead(when, f, dur, vel) {
      const end = when + dur + 0.6, lp = filter('lowpass', 1500 + vel * 1600, 0.8), e = adsr(when, 0.09, vel, Math.max(0.01, dur - 0.09), 0.4);
      const a = osc('sawtooth', f, when, end), b = osc('sawtooth', f, when, end), c = osc('sine', f * 2, when, end);
      b.detune.value = 9;
      const vib = osc('sine', 5.3, when, end), depth = gain(0);
      depth.gain.setValueAtTime(0, when + 0.2); depth.gain.linearRampToValueAtTime(f * 0.007, when + 0.7);
      vib.connect(depth); depth.connect(a.frequency); depth.connect(b.frequency);
      const cg = gain(0.2); c.connect(cg); a.connect(lp); b.connect(lp); cg.connect(lp);
      lp.connect(e); out(e, 0.13, 0.55, -0.1);
    },
    bass(when, f, dur, vel) {
      const end = when + dur + 0.4, lp = filter('lowpass', 420, 0.7), e = adsr(when, 0.03, vel, Math.max(0.01, dur - 0.03), 0.3);
      osc('triangle', f, when, end).connect(lp); osc('sine', f / 2, when, end).connect(lp);
      lp.connect(e); out(e, 0.38, 0.1);
    },
    boom(when, vel) {
      const end = when + 2, o = osc('sine', 96, when, end), e = decay(when, 0.004, vel, 0.3);
      o.frequency.exponentialRampToValueAtTime(36, when + 0.5); o.connect(e); out(e, 0.9, 0.25);
      const lp = filter('lowpass', 240), ne = decay(when, 0.002, vel, 0.05); noise(brown, when, when + 0.5).connect(lp); lp.connect(ne); out(ne, 0.8, 0.2);
    },
    riser(when, dur, vel, late) {
      const d = Math.max(0.1, dur - (late || 0)), end = when + d, p0 = (late || 0) / dur;
      const bp = filter('bandpass', 300, 1.1), e = gain(0);
      bp.frequency.setValueAtTime(300 * Math.pow(22, p0), when); bp.frequency.exponentialRampToValueAtTime(6600, end);
      e.gain.setValueAtTime(vel * p0 * p0, when); e.gain.linearRampToValueAtTime(vel, end - 0.02); e.gain.linearRampToValueAtTime(0, end + 0.03);
      noise(white, when, end + 0.1).connect(bp); bp.connect(e); out(e, 0.5, 0.3);
      const o = osc('sawtooth', 55 * Math.pow(4, p0), when, end + 0.1), lp = filter('lowpass', 900), oe = gain(0);
      o.frequency.exponentialRampToValueAtTime(220, end); oe.gain.setValueAtTime(vel * p0 * 0.5, when); oe.gain.linearRampToValueAtTime(vel * 0.5, end - 0.02); oe.gain.linearRampToValueAtTime(0, end + 0.03);
      o.connect(lp); lp.connect(oe); out(oe, 0.3, 0.2);
    },
    thunder(when, vel, close) {
      const dur = 5.5, lp = filter('lowpass', close ? 2600 : 520, 0.4), e = gain(0);
      lp.frequency.setValueAtTime(close ? 2600 : 520, when); lp.frequency.exponentialRampToValueAtTime(90, when + dur * 0.8);
      // a crack, then rolling echoes
      const curve = new Float32Array(48);
      for (let i = 0; i < curve.length; i++) { const x = i / (curve.length - 1); curve[i] = vel * Math.pow(1 - x, 1.7) * (0.45 + 0.55 * rng()) * (i === 0 ? 0 : 1); }
      curve[1] = vel; curve[curve.length - 1] = 0;
      e.gain.setValueCurveAtTime(curve, when, dur);
      noise(brown, when, when + dur + 0.1, 0.8).connect(lp); lp.connect(e); out(e, 1.5, 0.4, (rng() - 0.5) * 0.8);
      if (close) { const hp = filter('highpass', 1800), ce = decay(when, 0.002, vel * 0.5, 0.06); noise(white, when, when + 0.5).connect(hp); hp.connect(ce); out(ce, 0.7, 0.5); }
    },
    step(when, vel, kind) {
      const bp = filter('bandpass', kind === 'metal' ? 1500 : kind === 'stairs' ? 950 : 700, 1.3), e = decay(when, 0.002, vel, 0.035);
      noise(white, when, when + 0.3).connect(bp); bp.connect(e); out(e, 0.55, 0.25, 0.1);
      const o = osc('sine', 120, when, when + 0.4), oe = decay(when, 0.003, vel, 0.06); o.frequency.exponentialRampToValueAtTime(52, when + 0.12); o.connect(oe); out(oe, 0.55, 0.12);
      const servo = osc('sawtooth', 180, when - 0.2, when + 0.02), sf = filter('bandpass', 900, 5), se = adsr(when - 0.2, 0.05, vel * 0.1, 0.1, 0.05);
      servo.frequency.linearRampToValueAtTime(260, when); servo.connect(sf); sf.connect(se); out(se, 0.5, 0.1);
      if (kind === 'metal') [620, 931].forEach((f) => { const r = decay(when, 0.002, vel * 0.12, 0.12); osc('sine', f, when, when + 0.8).connect(r); out(r, 0.5, 0.4); });
    },
    clang(when, vel) {
      [311, 523, 811, 1243, 1777, 2410].forEach((f, k) => { const e = decay(when, 0.002, vel / (1 + k * 0.5), 0.35 - k * 0.04); osc(k % 2 ? 'square' : 'sine', f, when, when + 2.5).connect(e); out(e, 0.16, 0.6, 0.2); });
      const bp = filter('bandpass', 2600, 0.8), e = decay(when, 0.002, vel, 0.07); noise(white, when, when + 0.6).connect(bp); bp.connect(e); out(e, 0.5, 0.4);
    },
    lever(when, vel) {
      [0, 0.09].forEach((dt, k) => {
        const bp = filter('bandpass', k ? 420 : 1900, 2), e = decay(when + dt, 0.002, vel * (k ? 1 : 0.6), k ? 0.07 : 0.02);
        noise(white, when + dt, when + dt + 0.5).connect(bp); bp.connect(e); out(e, 0.8, 0.3, 0.15);
      });
      const o = osc('sine', 82, when + 0.09, when + 0.7), oe = decay(when + 0.09, 0.004, vel, 0.09); o.connect(oe); out(oe, 0.7, 0.2);
    },
    ignite(when) {
      const lp = filter('lowpass', 200, 1.5), e = decay(when, 0.03, 1, 0.55);
      lp.frequency.setValueAtTime(200, when); lp.frequency.exponentialRampToValueAtTime(7000, when + 0.22); lp.frequency.exponentialRampToValueAtTime(400, when + 2.2);
      noise(white, when, when + 4).connect(lp); lp.connect(e); out(e, 0.5, 0.6);
      const sub = osc('sine', 62, when, when + 4), se = decay(when, 0.01, 1, 0.8); sub.frequency.exponentialRampToValueAtTime(41, when + 1.2); sub.connect(se); out(se, 0.9, 0.2);
    },
    whale(when, f0, f1, dur, vel, pan) {
      const end = when + dur + 1.2, e = adsr(when, dur * 0.3, vel, dur * 0.4, dur * 0.3 + 0.5), bp = filter('bandpass', (f0 + f1) * 0.9, 0.6);
      const a = osc('sine', f0, when, end), b = osc('sine', f0 * 2.01, when, end), c = osc('triangle', f0 * 0.5, when, end);
      [[a, 1], [b, 2.01], [c, 0.5]].forEach(([o, m]) => {
        o.frequency.setValueAtTime(f0 * m, when); o.frequency.linearRampToValueAtTime(f0 * m * 0.96, when + dur * 0.15);   // a little dip before the rise
        o.frequency.exponentialRampToValueAtTime(f1 * m, when + dur * 0.8); o.frequency.exponentialRampToValueAtTime(f1 * m * 0.97, when + dur + 0.4);
      });
      const vib = osc('sine', 4.2, when, end), depth = gain(0); vib.frequency.linearRampToValueAtTime(6.4, when + dur);
      depth.gain.setValueAtTime(0, when); depth.gain.linearRampToValueAtTime(f1 * 0.022, when + dur);
      vib.connect(depth); depth.connect(a.frequency); depth.connect(b.frequency);
      const bg = gain(0.22), cg = gain(0.35); a.connect(bp); b.connect(bg); bg.connect(bp); c.connect(cg); cg.connect(bp);
      bp.connect(e);
      // an echo as wide as the sea
      const dl = ctx.createDelay(1), fb = gain(0.42); dl.delayTime.value = 0.43; e.connect(dl); dl.connect(fb); fb.connect(dl);
      out(e, 0.5, 0.9, pan); out(dl, 0.25, 0.9, -(pan || 0));
      setTimeout(() => { try { fb.disconnect(); } catch (err) { /* context closed */ } }, (when - ctx.currentTime + dur + 6) * 1000);
    },
    tick(when, vel, pitch) {
      const bp = filter('bandpass', 2600 * pitch, 6), e = decay(when, 0.001, vel, 0.012);
      noise(white, when, when + 0.2).connect(bp); bp.connect(e); out(e, 1.6, 0.25);
      const o = osc('sine', 1900 * pitch, when, when + 0.2), oe = decay(when, 0.001, vel * 0.5, 0.02); o.connect(oe); out(oe, 0.7, 0.3);
    },
    powerDown(when, vel) {
      const o = osc('sawtooth', 240, when, when + 2.2), lp = filter('lowpass', 1400, 1), e = decay(when, 0.01, vel, 0.45);
      o.frequency.exponentialRampToValueAtTime(28, when + 1.3); lp.frequency.setValueAtTime(1400, when); lp.frequency.exponentialRampToValueAtTime(90, when + 1.3);
      o.connect(lp); lp.connect(e); out(e, 0.5, 0.4);
    },
    splash(when, vel) {
      const bp = filter('bandpass', 1600, 0.5), e = adsr(when, 0.25, vel, 0.3, 2.6);
      bp.frequency.setValueAtTime(1800, when); bp.frequency.exponentialRampToValueAtTime(350, when + 3);
      noise(white, when, when + 3.4).connect(bp); bp.connect(e); out(e, 0.5, 0.5, 0.2);
    }
  };

  // --- continuous beds: wind, sea, rain, drone. Their levels are automated from the timeline. ---
  const beds = {};
  function startBeds() {
    const t0 = ctx.currentTime, bed = (name, node) => { const g = gain(0); node.connect(g); g.connect(filmGain); beds[name] = g.gain; };
    const src = (buf, rate) => { const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true; n.playbackRate.value = rate; n.start(t0); return n; };
    const lfo = (rate, depth, param) => { const o = ctx.createOscillator(); o.frequency.value = rate; const g = gain(depth); o.connect(g); g.connect(param); o.start(t0); };
    const windBp = filter('bandpass', 520, 1.6); src(white, 0.7).connect(windBp); lfo(0.13, 260, windBp.frequency); lfo(0.31, 90, windBp.frequency);
    const whistle = filter('bandpass', 1650, 9), wg = gain(0.22); src(white, 1).connect(whistle); whistle.connect(wg); lfo(0.09, 420, whistle.frequency);
    const windMix = gain(1); windBp.connect(windMix); wg.connect(windMix); bed('wind', windMix);
    const seaLp = filter('lowpass', 520, 0.5), swell = gain(0.7); src(brown, 1).connect(seaLp); seaLp.connect(swell); lfo(0.115, 0.3, swell.gain); bed('sea', swell);
    const rainHp = filter('highpass', 5200, 0.5); src(white, 1.3).connect(rainHp); bed('rain', rainHp);
    const droneLp = filter('lowpass', 170, 0.9);
    [[hz('D1'), 'sawtooth', 0], [hz('D2'), 'sawtooth', 9], [hz('A1'), 'sine', 0], [hz('D1') / 2, 'sine', 0]].forEach(([f, type, detune]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = detune; o.connect(droneLp); o.start(t0);
    });

  }

  return { I, beds, startBeds, openSession, closeSession, filmGain, master };
}

/** The score: every musical and sound-effect event in this part, as [time, play(I, when, late)] records. 120 BPM, six beats to a 3-second bar, so the countdown ticks land on the beat. */
function buildScore(timeline) {
  const ev = [];
  const add = (t, fn, dur) => ev.push({ t, dur: dur || 0, fn });
  const bell = (t, n, vel, pan) => add(t, (I, w) => I.bell(w, hz(n), vel, pan || 0));
  const pad = (t, notes, dur, vel, cutoff, release) => add(t, (I, w, late) => I.pad(w, notes.map(hz), dur, vel, cutoff, release, late), dur);
  const boom = (t, vel) => add(t, (I, w) => I.boom(w, vel));
  const whale = (t, a, b, dur, vel, pan) => add(t, (I, w) => I.whale(w, hz(a), hz(b), dur, vel, pan || 0));
  const T = CFG.T;

  // cold open: the old lullaby, three notes of it, and then the power dies under it
  [['A4', 0.3], ['C5', 0.8], ['F5', 1.3]].forEach(([n, t]) => bell(t, n, 0.42, 0));
  pad(0.1, ['F3', 'A3', 'C4', 'F4'], T.LIGHT_OUT - 0.15, 0.6, 1500, 0.05);
  add(T.LIGHT_OUT, (I, w) => { I.lever(w, 0.9); I.powerDown(w, 0.8); });
  boom(4.5, 0.35); boom(4.8, 0.22);

  // the countdown: one tick a second, two a second for the last ten, a higher pitch for the last three
  for (let sec = 60; sec >= 1; sec--) {
    const t = T.TIMER_ZERO - sec;
    if (t >= T.IGNITE) break;
    const loud = 0.16 + (60 - sec) * 0.004;
    add(t, (I, w) => I.tick(w, sec <= 10 ? loud + 0.14 : loud, sec <= 3 ? 1.6 : 1));
    if (sec <= 10 && t + 0.5 < T.IGNITE) add(t + 0.5, (I, w) => I.tick(w, loud, 0.8));
  }

  // the run (6-21 s): a driving ostinato in D minor, harmony turning the screw every two bars
  const OSTINATO = ['D2', 'D2', 'F2', 'D2', 'A2', 'D2', 'D2', 'F2', 'D2', 'A2', 'G2', 'F2'];
  const drive = (from, to, vel, octave) => { for (let t = from, i = 0; t < to - 0.01; t += BEAT / 2, i++) add(t, (I, w) => I.pluck(w, hz(OSTINATO[i % 12]) * octave, vel, i % 2 ? 0.3 : -0.3)); };
  boom(6, 0.9);
  drive(6, T.STUMBLE, 0.5, 2);
  for (let t = 6; t < T.STUMBLE; t += BEAT * 3) boom(t, 0.5);
  pad(6, ['D3', 'A3', 'F4'], 6, 0.6, 800, 0.3);
  pad(12, ['Bb2', 'F3', 'D4'], 6, 0.7, 1000, 0.3);
  pad(18, ['G2', 'D3', 'Bb3', 'Eb4'], 4.5, 0.85, 1500, 0.06);
  whale(18.3, 'D2', 'A1', 2.2, 0.6, -0.3);                                    // the shadow has a voice
  add(18, (I, w, late) => I.riser(w, 4.5, 0.7, late), 4.5);
  add(T.STUMBLE, (I, w) => { I.boom(w, 1); I.clang(w + 0.28, 0.9); });
  pad(T.STUMBLE, ['D2', 'Eb3', 'Bb3'], 2.4, 0.6, 420, 1.8);

  // 25.5-30 s: only the clock, and then the figure
  add(27, (I, w) => I.boom(w, 0.9));
  pad(27, ['D3', 'Eb4', 'A4', 'Bb5'], 1.6, 0.8, 2600, 1.6);                   // stinger

  // the standoff (30-63 s): a held wrongness, a heartbeat, the lullaby bent out of tune
  pad(30, ['D2', 'A2', 'Eb3'], 15, 0.5, 420, 1.2);
  for (let t = 33; t < 57; t += 3) { boom(t, 0.3); boom(t + 0.3, 0.2); }
  bell(36.3, 'A4', 0.3, 0.3); bell(37.0, 'C5', 0.3, 0.3); bell(37.7, 'E5', 0.34, 0.3);       // "Keeper Seven." — the tune, with its last note wrong
  bell(42.3, 'Bb4', 0.26, -0.3); bell(43.8, 'A4', 0.24, -0.3);
  whale(47.2, 'E2', 'B1', 2.4, 0.7, 0.3); whale(52.4, 'D2', 'G1', 2.4, 0.75, 0.2); whale(58.2, 'F2', 'C2', 2.2, 0.8, 0.2);
  pad(45, ['D2', 'Ab2', 'Eb3'], 12, 0.65, 520, 0.3);
  drive(51, 57, 0.25, 2); drive(57, T.IGNITE, 0.5, 2);
  pad(57, ['D2', 'Ab2', 'Eb3', 'A3', 'D4'], T.IGNITE - 57 - 0.05, 0.95, 1500, 0.04);
  for (let t = 57; t < T.IGNITE - 0.1; t += t < 62 ? BEAT * 2 : BEAT) boom(t, 0.55 + (t - 57) * 0.04);
  add(57, (I, w, late) => I.riser(w, T.IGNITE - 57, 0.95, late), T.IGNITE - 57);

  // one second to spare: the light, and for six seconds it sounds like the first film
  add(T.IGNITE, (I, w) => { I.lever(w, 1); I.ignite(w); I.boom(w, 1); });
  pad(T.IGNITE, ['D2', 'A2', 'D3', 'F#3', 'A3', 'D4'], 1.3, 0.9, 3000, 0.5);
  whale(66.9, 'G3', 'D4', 1.9, 0.6, 0.25);
  pad(66.6, ['F3', 'A3', 'C4', 'F4', 'A4'], 5.2, 0.6, 1600, 0.5);
  [['A4', 67.0], ['C5', 67.5], ['F5', 68.0]].forEach(([n, t]) => bell(t, n, 0.45, 0));
  pad(69.6, ['F3', 'Gb3', 'C4', 'B4'], 3.0, 0.5, 1100, 0.1);                   // "Keep watching." — the chord curdles

  // the second pass: the song falls two octaves and stops
  add(T.DOUSE, (I, w) => I.boom(w, 0.9));
  whale(T.DOUSE + 0.1, 'D4', 'D2', 2.4, 0.8, 0.2);
  ['F5', 'E5', 'Db5', 'Bb4', 'Gb4'].forEach((n, i) => bell(T.DOUSE + 0.3 + i * 0.36, n, 0.34, (i - 2) * 0.2));
  pad(T.DOUSE, ['D2', 'Eb3', 'Bb3'], 5, 0.5, 380, 1.5);
  [75.5, 77].forEach((t) => { boom(t, 0.3); boom(t + 0.3, 0.2); });

  // what is under the island
  add(78, (I, w, late) => I.riser(w, T.BLACK - 78, 0.8, late), T.BLACK - 78);
  pad(78, ['D1', 'D2', 'Ab2'], T.BLACK - 78 - 0.03, 0.9, 300, 0.02);
  pad(T.EYE_OPEN, ['D2', 'Ab2', 'Eb3', 'A3', 'Eb4', 'Bb4'], T.BLACK - T.EYE_OPEN - 0.03, 1.0, 2600, 0.02);
  add(T.EYE_OPEN, (I, w) => { I.boom(w, 1); I.ignite(w); });
  whale(T.EYE_OPEN + 0.2, 'A1', 'D1', 2.2, 1.0, 0);
  for (let t = T.EYE_OPEN + 0.5; t < T.BLACK - 0.1; t += BEAT) boom(t, 0.8);
  // black. One tick. One wrong bell.
  add(T.BLACK + 0.5, (I, w) => I.tick(w, 0.4, 1));
  bell(T.END_CARD + 0.2, 'A4', 0.3, 0); bell(T.END_CARD + 0.9, 'C5', 0.3, 0); bell(T.END_CARD + 1.6, 'E5', 0.3, 0);

  // ---- sound effects tied to picture ----------------------------------------------------------------
  CFG.LIGHTNING.forEach((s) => { const close = s.dist < 200; add(s.t + (close ? 0.02 : s.dist / 1400), (I, w) => I.thunder(w, 0.5 * s.power, close)); });
  timeline.footfalls().forEach((f) => add(f.t, (I, w) => I.step(w, f.metal ? 0.5 : 0.62, f.metal ? 'metal' : f.stairs ? 'stairs' : 'stone')));
  add(58.5, (I, w) => I.splash(w, 0.6)); add(74.2, (I, w) => I.splash(w, 0.7));
  add(64.5, (I, w) => I.lever(w, 0.35));

  ev.sort((a, b) => a.t - b.t);
  return ev;
}

/** Level of each continuous bed at film time t. */
function bedLevels(timeline, t, outLevels) {
  const storm = timeline.sample('storm', t), rain = timeline.sample('rain', t);
  const hush = (1 - 0.6 * pulse(t, 25.3, 25.6, 29.5, 30.5)) * (t >= CFG.T.BLACK ? 0 : 1);        // the storm drops away when the figure appears, and at the cut to black
  outLevels.wind = (0.02 + 0.06 * storm) * hush;
  outLevels.sea = (0.035 + 0.06 * storm) * hush;
  outLevels.rain = 0.028 * rain * hush;
  outLevels.drone = sampleTrack(DRONE_TRACK, t);
  outLevels.film = sampleTrack(FILM_GAIN_TRACK, t);
  return outLevels;
}
const DRONE_TRACK = [[0, 0], [2.6, 0], [3.2, 0.1], [22.5, 0.15], [30, 0.1], [57, 0.14], [65.2, 0.24], [65.3, 0.04], [72.6, 0.04], [75, 0.14], [82.46, 0.26], [82.5, 0, EASE.in]];
const FILM_GAIN_TRACK = [[0, 0], [0.25, 1], [85.5, 1], [86.9, 0]];

function createAudio(timeline) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  let ctx;
  try { ctx = new AC({ latencyHint: 'playback' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
  const A = CFG.AUDIO, synth = createSynth(ctx, ctx.destination), score = buildScore(timeline), levels = {};
  synth.startBeds();
  let anchorFilm = 0, anchorCtx = 0, cursor = 0, horizon = 0, running = false, muted = false;
  const toCtx = (tFilm) => anchorCtx + (tFilm - anchorFilm);

  function setBeds(tFilm, when, ramp) {
    bedLevels(timeline, tFilm, levels);
    const apply = (param, v) => { if (ramp) param.linearRampToValueAtTime(v, when); else { param.cancelScheduledValues(0); param.setValueAtTime(v, when); } };
    apply(synth.beds.wind, levels.wind); apply(synth.beds.sea, levels.sea); apply(synth.beds.rain, levels.rain); apply(synth.beds.drone, levels.drone);
    apply(synth.filmGain.gain, levels.film);
  }
  function pump(tFilm) {
    const until = Math.min(tFilm + A.LOOKAHEAD, CFG.DURATION);
    while (cursor < score.length && score[cursor].t < until) { const e = score[cursor++]; e.fn(synth.I, Math.max(toCtx(e.t), ctx.currentTime + 0.005), 0); }
    while (horizon < until) { horizon += A.AUTOMATION_STEP; setBeds(horizon, toCtx(horizon), true); }
  }
  return {
    ctx,
    get muted() { return muted; },
    setMuted(m) { muted = m; synth.master.gain.setTargetAtTime(m ? 0 : A.MASTER, ctx.currentTime, 0.03); },
    /** Begin (or re-begin) playback with film time `tFilm` sounding START_DELAY from now. */
    start(tFilm) {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      synth.closeSession(ctx.currentTime); synth.openSession();
      anchorFilm = tFilm; anchorCtx = ctx.currentTime + A.START_DELAY; running = true;
      cursor = 0;
      for (let i = 0; i < score.length; i++) {
        const e = score[i];
        if (e.t >= tFilm) break;
        cursor = i + 1;
        if (e.dur && e.t + e.dur > tFilm + 0.4) e.fn(synth.I, anchorCtx, tFilm - e.t);      // re-enter sustained notes mid-way
      }
      horizon = tFilm; setBeds(tFilm, anchorCtx, false);
      pump(tFilm);
    },
    stop() {
      if (!running) return;
      running = false; synth.closeSession(ctx.currentTime);
      const now = ctx.currentTime;
      [synth.beds.wind, synth.beds.sea, synth.beds.rain, synth.beds.drone].forEach((p) => { p.cancelScheduledValues(0); p.setTargetAtTime(0, now, 0.05); });
    },
    /** Called every frame while playing; reschedules if the clocks have drifted apart. */
    tick(tFilm) {
      if (!running || ctx.state !== 'running') return;
      const drift = (ctx.currentTime - anchorCtx) - (tFilm - anchorFilm);
      if (Math.abs(drift) > A.RESYNC_TOLERANCE) { this.start(tFilm); return; }
      pump(tFilm);
    },
    dispose() { try { synth.closeSession(ctx.currentTime); ctx.close(); } catch (e) { /* already closed */ } }
  };
}

/* ============================================================================
 * 10. APP — boot, graceful fallbacks, render loop, transport and UI.
 * ========================================================================== */
function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  return CFG.THREE_URLS.reduce((chain, url) => chain.catch(() => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => (window.THREE ? resolve(window.THREE) : reject(new Error('three.js did not initialise')));
    s.onerror = () => { s.remove(); reject(new Error('could not load ' + url)); };
    document.head.appendChild(s);
  })), Promise.reject(new Error('start')));
}

function boot() {
  const $ = (id) => document.getElementById(id);
  const dom = {
    frame: $('frame'), title: $('titleCard'), cardTitle: $('cardTitle'), cardSub: $('cardSub'), hud: $('hud'), hudLabel: $('hudLabel'), hudTime: $('hudTime'), subtitle: $('subtitle'), subText: $('subtitle').firstElementChild, end: $('endCard'), start: $('startCard'),
    btnStart: $('btnStart'), note: $('startNote'), btnReplay: $('btnReplay'), fallback: $('fallback'), fallbackText: $('fallbackText'), controls: $('controls'),
    btnPlay: $('btnPlay'), icoPlay: $('icoPlay'), icoPause: $('icoPause'), scrub: $('scrub'), time: $('time'), btnMute: $('btnMute'), icoSound: $('icoSound'), icoMuted: $('icoMuted'), btnFs: $('btnFs')
  };
  const fail = (message) => { dom.start.classList.add('hidden'); dom.controls.style.display = 'none'; dom.fallbackText.textContent = message; dom.fallback.classList.add('show'); };
  const STORY = 'Rule one: the light never goes out. Tonight it went out, and the keeper has sixty seconds to climb the tower and relight it. Someone is already standing at the lamp. It says its name is Keeper Seven. So is the keeper\u2019s.';

  loadThree().then((THREE) => {
    let film;
    try { film = createFilm(THREE, dom); } catch (err) { fail('This film is drawn live with WebGL, which this browser or device could not start. ' + STORY); return; }
    window.__film = film.api;
  }, () => fail('The 3D engine (three.js) could not be loaded. Check your connection once and reload; after that the film runs offline. ' + STORY));
}

function createFilm(THREE, dom) {
  const RC = CFG.RENDER, disposables = [], HUD_DANGER_SECONDS = 10;
  const DURATION_LABEL = ' / ' + Math.floor(CFG.DURATION / 60) + ':' + String(Math.floor(CFG.DURATION % 60)).padStart(2, '0');
  const canvas = document.createElement('canvas');
  // probe first: three.js logs an error of its own when no context can be made
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL unavailable');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1); renderer.autoClear = true; renderer.setClearColor(0x000000, 1);
  dom.frame.insertBefore(canvas, dom.frame.firstChild);

  const assets = createAssets(THREE, disposables);
  const world = createWorld(THREE, assets, disposables);
  const robot = createRobot(THREE, assets, disposables);
  world.scene.add(robot.root);
  const robotB = createRobot(THREE, assets, disposables, new THREE.Color(1.0, 0.1, 0.05));       // the other one
  world.scene.add(robotB.root);
  const camera = new THREE.PerspectiveCamera(35, CFG.ASPECT, RC.NEAR, RC.FAR);
  const cameras = createCameraSystem(THREE, camera);
  const timeline = createTimeline(THREE);
  const post = createPost(THREE, renderer, disposables);

  const clock = { t: 0, playing: false, last: 0, ended: false, raf: 0, scale: 1, frameMs: 0, frames: 0, fastWindows: 0, audioDirty: false, lastAudioRestart: 0 };
  let audio = null, audioTried = false, destroyed = false, contextLost = false;
  const ui = { title: -1, end: -1, sub: -1, hud: -1, subText: '', subWho: '', card: '', hudText: '', hudLabel: '', hudDanger: null, timeText: '', pct: -1, idleAt: 0, scrubbing: false };

  // ---------------------------------------------------------------- sizing ---
  function resize() {
    const rect = dom.frame.getBoundingClientRect();
    if (rect.width < 2) return;
    let ratio = Math.min(window.devicePixelRatio || 1, RC.MAX_PIXEL_RATIO) * clock.scale;
    const pixels = rect.width * rect.height * ratio * ratio;
    if (pixels > RC.MAX_PIXELS) ratio *= Math.sqrt(RC.MAX_PIXELS / pixels);
    const w = Math.max(64, Math.round(rect.width * ratio)), h = Math.max(32, Math.round(w / CFG.ASPECT));
    renderer.setSize(w, h, false); post.setSize(w, h);
    if (!clock.playing) renderFrame();
  }

  // ---------------------------------------------------------------- render ---
  function renderFrame() {
    if (contextLost || destroyed) return;
    const t = clock.t, s = timeline.evaluate(t);
    s.robot.leverTarget.copy(world.poseLever(s.lever));
    robot.update(s.robot);
    s.robotB.leverTarget.copy(s.robot.leverTarget); robotB.update(s.robotB);
    cameras.update(t, s, robot.headWorld, s.robot.leverTarget);
    s.pointScale = post.height / (2 * Math.tan((camera.fov * Math.PI) / 360));
    world.update(s, camera);
    post.render(world.scene, camera, s, cameras.rig, world.flareFacing);
    updateOverlays(s);
  }
  function setOpacity(el, key, value) {
    const q = Math.round(value * 100) / 100;
    if (ui[key] !== q) { ui[key] = q; el.style.opacity = q; }
  }
  function updateOverlays(s) {
    setOpacity(dom.title, 'title', s.titleOpacity * s.fade);
    setOpacity(dom.end, 'end', s.endOpacity);
    setOpacity(dom.subtitle, 'sub', s.subtitleOpacity);
    if (s.subtitleOpacity > 0 && ui.subText !== s.subtitle) { ui.subText = s.subtitle; dom.subText.textContent = s.subtitle; }
    if (ui.subWho !== s.subtitleWho) { ui.subWho = s.subtitleWho; dom.subtitle.className = 'overlay who-' + s.subtitleWho; }
    if (s.titleOpacity > 0 && ui.card !== s.cardTitle) { ui.card = s.cardTitle; dom.cardTitle.textContent = s.cardTitle; dom.cardSub.textContent = s.cardSub; }
    setOpacity(dom.hud, 'hud', s.hudOpacity * s.fade);
    if (s.hudOpacity > 0) {
      const secs = s.hudSeconds, failed = s.hudMode === 'failed';
      const label = failed ? 'Containment' : s.hudMode === 'held' ? 'Light restored' : 'Relight window';
      const text = failed ? 'FAILED' : '00:' + String(Math.floor(secs)).padStart(2, '0') + '.' + Math.floor((secs % 1) * 10);
      const danger = failed || (s.hudMode === 'count' && secs <= HUD_DANGER_SECONDS);
      if (ui.hudText !== text) { ui.hudText = text; dom.hudTime.textContent = text; }
      if (ui.hudLabel !== label) { ui.hudLabel = label; dom.hudLabel.textContent = label; }
      if (ui.hudDanger !== danger) { ui.hudDanger = danger; dom.hud.classList.toggle('danger', danger); }
    }
    dom.end.classList.toggle('live', s.endOpacity > 0.5);
    updateTransport();
  }
  function updateTransport() {
    const secs = Math.floor(clock.t), text = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') + DURATION_LABEL;
    if (text !== ui.timeText) { ui.timeText = text; dom.time.textContent = text; }
    const pct = Math.round((clock.t / CFG.DURATION) * 1000) / 10;
    if (pct !== ui.pct) { ui.pct = pct; dom.scrub.style.setProperty('--pct', pct + '%'); if (!ui.scrubbing) dom.scrub.value = clock.t; }
  }

  // ------------------------------------------------------------------ loop ---
  function adaptResolution(ms) {
    clock.frameMs += ms;
    if (++clock.frames < RC.ADAPT_WINDOW) return;
    const avg = clock.frameMs / clock.frames; clock.frameMs = 0; clock.frames = 0;
    if (avg > RC.SLOW_FRAME_MS && clock.scale > RC.MIN_SCALE) { clock.scale = Math.max(RC.MIN_SCALE, clock.scale * RC.SCALE_STEP); clock.fastWindows = 0; resize(); }
    else if (avg < RC.FAST_FRAME_MS && clock.scale < 1 && ++clock.fastWindows >= 4) { clock.scale = Math.min(1, clock.scale / RC.SCALE_STEP); clock.fastWindows = 0; resize(); }
  }
  function frame(now) {
    clock.raf = 0;
    if (!clock.playing) return;
    const elapsed = (now - clock.last) / 1000; clock.last = now;
    clock.t += clamp(elapsed, 0, RC.MAX_FRAME_DT);      // follow the wall clock so picture never drifts from sound
    if (clock.t >= CFG.DURATION) { clock.t = CFG.DURATION; setPlaying(false); clock.ended = true; renderFrame(); showControls(); return; }
    if (audio) {
      if (clock.audioDirty && now - clock.lastAudioRestart > 160) { audio.start(clock.t); clock.audioDirty = false; clock.lastAudioRestart = now; }
      else audio.tick(clock.t);
    }
    renderFrame();
    adaptResolution(elapsed * 1000);
    if (now > ui.idleAt && !ui.scrubbing) dom.controls.classList.add('idle');
    clock.raf = requestAnimationFrame(frame);
  }
  function ensureAudio() {
    if (audioTried) return;
    audioTried = true;
    audio = createAudio(timeline);
    if (!audio) { dom.btnMute.style.display = 'none'; dom.note.textContent = 'Sound is unavailable here — playing silent'; }
  }
  function setPlaying(on) {
    if (on === clock.playing) return;
    clock.playing = on;
    dom.icoPlay.style.display = on ? 'none' : ''; dom.icoPause.style.display = on ? '' : 'none';
    if (on) {
      if (clock.ended || clock.t >= CFG.DURATION) { clock.t = 0; clock.ended = false; }
      ensureAudio();
      if (audio) audio.start(clock.t);
      clock.last = performance.now();
      if (!clock.raf) clock.raf = requestAnimationFrame(frame);
    } else if (audio) audio.stop();
  }
  function seek(t) {
    clock.t = clamp(t, 0, CFG.DURATION); clock.ended = false;
    if (clock.playing) clock.audioDirty = true; else renderFrame();
  }
  function showControls() { dom.controls.classList.remove('idle'); ui.idleAt = performance.now() + CFG.UI.IDLE_HIDE_MS; }

  // -------------------------------------------------------------------- UI ---
  const listeners = [];
  const on = (target, type, fn, opts) => { target.addEventListener(type, fn, opts); listeners.push(() => target.removeEventListener(type, fn, opts)); };
  on(dom.btnStart, 'click', () => { dom.start.classList.add('hidden'); seek(0); setPlaying(true); showControls(); });
  on(dom.btnReplay, 'click', () => { seek(0); setPlaying(true); showControls(); });
  on(dom.btnPlay, 'click', () => { dom.start.classList.add('hidden'); setPlaying(!clock.playing); showControls(); });
  on(dom.btnMute, 'click', () => {
    if (!audio) return;
    audio.setMuted(!audio.muted);
    dom.icoSound.style.display = audio.muted ? 'none' : ''; dom.icoMuted.style.display = audio.muted ? '' : 'none';
  });
  on(dom.btnFs, 'click', () => {
    const el = document.documentElement, doc = document;
    if (doc.fullscreenElement || doc.webkitFullscreenElement) (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
    else { const req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } }
  });
  on(dom.scrub, 'pointerdown', () => { ui.scrubbing = true; });
  on(dom.scrub, 'input', () => { dom.start.classList.add('hidden'); seek(parseFloat(dom.scrub.value)); showControls(); });
  const endScrub = () => { ui.scrubbing = false; };
  on(dom.scrub, 'change', endScrub); on(window, 'pointerup', endScrub); on(window, 'pointercancel', endScrub);
  ['pointermove', 'pointerdown', 'keydown'].forEach((type) => on(window, type, showControls, { passive: true }));
  on(dom.frame, 'click', (e) => { if (e.target.closest('button')) return; if (!dom.start.classList.contains('hidden')) return; showControls(); });
  on(window, 'keydown', (e) => {
    if (e.target === dom.scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); dom.start.classList.add('hidden'); setPlaying(!clock.playing); }
    else if (e.key === 'ArrowLeft') seek(clock.t - CFG.UI.SEEK_STEP);
    else if (e.key === 'ArrowRight') seek(clock.t + CFG.UI.SEEK_STEP);
    else if (e.key === 'm') dom.btnMute.click();
    else if (e.key === 'f') dom.btnFs.click();
  });
  on(document, 'visibilitychange', () => { if (document.hidden) setPlaying(false); });
  on(canvas, 'webglcontextlost', (e) => { e.preventDefault(); contextLost = true; setPlaying(false); });
  on(canvas, 'webglcontextrestored', () => { contextLost = false; resize(); renderFrame(); });
  on(window, 'resize', resize);
  on(window, 'orientationchange', resize);
  let observer = null;
  if (window.ResizeObserver) { observer = new ResizeObserver(resize); observer.observe(dom.frame); }

  function destroy() {
    if (destroyed) return;
    destroyed = true;
    if (clock.raf) cancelAnimationFrame(clock.raf);
    setPlaying(false);
    listeners.forEach((off) => off());
    if (observer) observer.disconnect();
    if (audio) audio.dispose();
    disposables.forEach((d) => d.dispose());
    renderer.dispose();
  }
  on(window, 'pagehide', (e) => { if (!e.persisted) destroy(); });

  resize();
  clock.t = CFG.UI.POSTER_T; renderFrame();          // a still from the storm sits behind the start card
  clock.t = 0; updateTransport();
  dom.btnStart.textContent = 'Play'; dom.btnStart.disabled = false;
  dom.controls.classList.remove('idle'); ui.idleAt = performance.now() + CFG.UI.IDLE_HIDE_MS;

  return {
    api: {
      duration: CFG.DURATION,
      shots: cameras.shots.map((s) => ({ name: s.name, type: s.type, start: s.start, end: s.end })),
      seek, play: () => setPlaying(true), pause: () => setPlaying(false), destroy,
      get time() { return clock.t; }, get playing() { return clock.playing; }, get audio() { return audio; },
      info: () => ({ hdr: post.hdr, depth: post.hasDepth, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, scale: clock.scale, size: [canvas.width, canvas.height] }),
      /** Render the complete soundtrack offline and report loudness per second (used by the automated checks). */
      analyseAudio() {
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!OAC) return Promise.resolve(null);
        const RATE = 22050, off = new OAC(2, RATE * CFG.DURATION, RATE), synth = createSynth(off, off.destination), score = buildScore(timeline), levels = {};
        synth.startBeds(); synth.openSession();
        for (let t = 0; t <= CFG.DURATION; t += CFG.AUDIO.AUTOMATION_STEP) {
          bedLevels(timeline, t, levels);
          ['wind', 'sea', 'rain', 'drone'].forEach((n) => synth.beds[n].linearRampToValueAtTime(levels[n], t + 0.001));
          synth.filmGain.gain.linearRampToValueAtTime(levels.film, t + 0.001);
        }
        score.forEach((e) => e.fn(synth.I, Math.max(e.t, 0.3 * (e.t < 0.3 ? 1 : 0)), 0));
        return off.startRendering().then((buf) => {
          const d = buf.getChannelData(0), rms = [];
          let peak = 0;
          for (let sec = 0; sec < CFG.DURATION; sec++) {
            let sum = 0;
            for (let i = sec * RATE; i < (sec + 1) * RATE; i++) { sum += d[i] * d[i]; peak = Math.max(peak, Math.abs(d[i])); }
            rms.push(Math.round(Math.sqrt(sum / RATE) * 1000) / 1000);
          }
          return { peak: Math.round(peak * 1000) / 1000, rms, events: score.length };
        });
      }
    }
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
