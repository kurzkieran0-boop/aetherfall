<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Last Driver</title>
  <style>
    @font-face { font-family: 'Lilita One'; src: url('fonts/LilitaOne.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Anton'; src: url('fonts/Anton.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; background: #0b0820; color: #fff3dc; font-family: 'Lilita One', sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    #view { height: min(86vh, 1920px); aspect-ratio: 9/16; background: #000; box-shadow: 0 10px 40px #0008; }
    #bar { display: flex; gap: 10px; align-items: center; width: min(90vw, 520px); }
    #scrub { flex: 1; }
    button { font: inherit; padding: 6px 16px; border-radius: 8px; border: 0; background: #ffc43d; color: #1b1033; }
    #info { font-family: monospace; font-size: 12px; opacity: .8; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="view"></canvas>
    <div id="bar"><button id="play">▶ / ❚❚</button><input id="scrub" type="range" min="0" step="0.01" value="0" /></div>
    <div id="info"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
